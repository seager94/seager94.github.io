name: Generate Lessons (batch)
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch file name (without .txt) from the batches/ folder'
        required: true
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Generate all lessons in the batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BATCH: ${{ inputs.batch }}
        run: |
          set -u
          REPO="$PWD"
          BATCH_FILE="$REPO/batches/${BATCH}.txt"
          if [ ! -f "$BATCH_FILE" ]; then
            echo "Batch file not found: $BATCH_FILE"
            echo "Available batches:"; ls "$REPO/batches/" || echo "(no batches/ folder)"
            exit 1
          fi
          # Read all task lines into memory BEFORE the agent runs.
          mapfile -t RAW_LINES < "$BATCH_FILE"
          # Claude Code can read files OUTSIDE its working dir by design, so cd-ing
          # into an isolated dir does NOT stop the agent finding the full to-do list.
          # Move batches/ out of the checkout during generation, restore before commit.
          HIDDEN="$RUNNER_TEMP/batches-hidden"
          rm -rf "$HIDDEN"; mv "$REPO/batches" "$HIDDEN"
          WORK="$RUNNER_TEMP/lesson-work"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cp -r "$REPO/.claude" "$WORK/.claude"
          for raw in "${RAW_LINES[@]}"; do
            task="$(printf '%s' "$raw" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$task" ] && continue
            case "$task" in \#*) continue ;; esac
            echo "=== Generating: $task ==="
            rm -f "$WORK"/*.html
            ( cd "$WORK" && claude -p "$task" --dangerously-skip-permissions --max-turns 100 ) \
              || echo "!!! FAILED, continuing: $task"
            mv "$WORK"/*.html "$REPO/" 2>/dev/null || echo "(no HTML produced for this task)"
          done
          # Restore batches/ so the commit step doesn't commit its deletion.
          mv "$HIDDEN" "$REPO/batches"
      - name: Commit the generated lessons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated lessons from batch: ${{ inputs.batch }}" || echo "Nothing to commit"
          git push