name: Generate Lessons (batch)

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch file name (without .txt) from the batches/ folder'
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate all lessons in the batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BATCH: ${{ inputs.batch }}
        run: |
          BATCH_FILE="batches/${BATCH}.txt"
          if [ ! -f "$BATCH_FILE" ]; then
            echo "Batch file not found: $BATCH_FILE"
            echo "Available batches:"
            ls batches/ || echo "(no batches/ folder)"
            exit 1
          fi
          mkdir -p lesson-drafts
          while IFS= read -r task || [ -n "$task" ]; do
            case "$task" in
              ""|"#"*) continue ;;
            esac
            echo "=== Generating: $task ==="
            claude -p "$task" --dangerously-skip-permissions --max-turns 100 || echo "!!! FAILED, continuing: $task"
          done < "$BATCH_FILE"

      - name: Commit the generated lessons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add generated lessons from batch: ${{ inputs.batch }}" || echo "Nothing to commit"
          git push
