<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<meta name="description" content="Course map for the card lessons: every lesson is open, the suggested next lesson is highlighted, and lessons finished on this device show a tick.">
<style>
:root{
  --ink:#1C1E21; --ink-2:#5F6670; --line:#D8DCE3; --desk:#F3F4F6;
  --charcoal:#2B2D2F; --charcoal-deep:#121314;
  --var:#2F6FED; --var-soft:#E6EEFF;
  --go:#2EAD5B; --go-deep:#1F8A45; --go-soft:#E7F7EC;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:40rem;margin:0 auto;padding:1.6rem 1.2rem 4rem}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 .3rem}
.intro{color:var(--ink-2);margin:0 0 1.4rem}
.unit{margin:0 0 2.2rem}
.unit-head{border:2px solid var(--var);border-radius:1rem;padding:.6rem 1rem;text-align:center;box-shadow:0 .2rem 0 var(--var);margin-bottom:1rem}
.unit-head small{display:block;color:var(--var);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.unit-head b{font-size:1.05rem}
.path{list-style:none;margin:0;padding:0;position:relative}
.node{display:flex;align-items:center;gap:1rem;padding:.55rem 0;position:relative}
.node:nth-child(4n+2){margin-left:18%} .node:nth-child(4n+3){margin-left:32%} .node:nth-child(4n+4){margin-left:18%}
.node a{display:flex;align-items:center;gap:1rem;color:inherit;text-decoration:none;border-radius:1rem;padding:.2rem .6rem .2rem .2rem}
.node a:hover .dot{transform:translateY(-2px)}
.node a:focus-visible{outline:3px solid var(--var);outline-offset:3px}
.dot{width:4rem;height:4rem;flex:none;border-radius:50%;display:grid;place-items:center;background:#E9ECEF;box-shadow:inset 0 -.35rem 0 #D2D7DE;transition:transform .15s;font-weight:700;color:var(--ink-2)}
.dot svg{width:1.6rem;height:1.6rem}
.label{line-height:1.3}
.label b{display:block;font-weight:600}
.label small{color:var(--ink-2)}
.node.done .dot{background:var(--go);box-shadow:inset 0 -.35rem 0 var(--go-deep);color:#fff}
.node.next .dot{background:var(--var);box-shadow:inset 0 -.35rem 0 #1F55C8,0 0 0 .4rem var(--var-soft);color:#fff}
.go{display:inline-block;margin-top:.35rem;background:var(--charcoal);color:#fff;border-radius:999px;padding:.35rem 1rem;font-weight:600;font-size:.9rem;box-shadow:0 .2rem 0 var(--charcoal-deep)}
.node.lc .dot{background:#fff;border:2px solid var(--ink-2);box-shadow:inset 0 -.3rem 0 var(--line);color:var(--ink)}
.node.lc.done .dot{border-color:var(--go-deep)}
.node.lc.next .dot{border-color:var(--var)}
.node.check .dot{background:#fff;border:2px dashed var(--line);box-shadow:none}
.node.check .label{color:var(--ink-2)}
.node.check span.link{display:flex;align-items:center;gap:1rem;padding:.2rem .6rem .2rem .2rem}
.foot{color:var(--ink-2);font-size:.85rem;border-top:1px solid var(--line);padding-top:1rem}
@media (max-width:30rem){ .node:nth-child(4n+2),.node:nth-child(4n+4){margin-left:10%} .node:nth-child(4n+3){margin-left:20%} .dot{width:3.4rem;height:3.4rem} }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{TITLE}}</h1>
  <p class="intro">{{INTRO}}</p>
  <div id="units"></div>
  <p class="foot">Ticks show lessons and Level Checks finished on this device and browser. A lesson can be updated without changing this map.</p>
</div>
<script>
(() => {
'use strict';
const MAP = {{MAP_JSON}};
const TICK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FLAG = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 17V3.5M5 4h9l-2 3.2 2 3.3H5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const done = slug => { try { return JSON.parse(localStorage.getItem('card-lesson:' + slug + ':done')); } catch (_) { return null; } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const order = MAP.units.flatMap(u => u.lessons.concat(u.check ? [u.check] : []));
const next = order.find(s => !done(s));          // suggested next lesson: the first one not finished on this device
const host = document.getElementById('units');
let n = 0;
MAP.units.forEach((u, ui) => {
  const items = u.lessons.map(s => {
    n++;
    const L = MAP.lessons[s], d = done(s), cls = d ? 'done' : (s === next ? 'next' : '');
    const status = d ? 'Finished' + (d.total ? ', ' + d.first + ' of ' + d.total + ' first try' : '') : (s === next ? 'Suggested next' : 'Year ' + L.year);
    return '<li class="node ' + cls + '"><a href="' + esc(L.href) + '" aria-label="' + esc(L.title + ', ' + status) + '">' +
      '<span class="dot">' + (d ? TICK : n) + '</span>' +
      '<span class="label"><b>' + esc(L.title) + '</b><small>' + esc(status) + '</small>' + (s === next ? '<br><span class="go">Start</span>' : '') + '</span></a></li>';
  }).join('');
  // Level Check: live once the unit has one (u.check), otherwise a dashed Coming soon node.
  let check = '<li class="node check"><span class="link"><span class="dot" aria-hidden="true">?</span><span class="label"><b>Level Check</b><small>Coming soon</small></span></span></li>';
  if (u.check) {
    const s = u.check, d = done(s), cls = d ? 'done' : (s === next ? 'next' : '');
    const status = d ? (d.total ? d.first + ' of ' + d.total + ' right first time' : 'Finished') : (s === next ? 'Suggested next' : 'Mixed questions from this unit');
    check = '<li class="node lc ' + cls + '"><a href="' + esc(MAP.lessons[s].href) + '" aria-label="' + esc('Level Check, ' + status) + '">' +
      '<span class="dot">' + (d ? TICK : FLAG) + '</span>' +
      '<span class="label"><b>Level Check</b><small>' + esc(status) + '</small>' + (s === next ? '<br><span class="go">Start</span>' : '') + '</span></a></li>';
  }
  host.insertAdjacentHTML('beforeend',
    '<section class="unit"><div class="unit-head"><small>Unit ' + (ui + 1) + ' · Year ' + u.year + '</small><b>' + esc(u.title) + '</b></div>' +
    '<ol class="path">' + items + check + '</ol></section>');
});
})();
</script>
</body>
</html>
