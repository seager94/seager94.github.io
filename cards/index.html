<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Algebra card lessons</title>
<meta name="description" content="Course map for the card lessons: every lesson is open, the suggested next lesson is highlighted, and lessons finished on this device show a tick.">
<style>
:root{
  --ink:#1C1E21; --ink-2:#5F6670; --line:#D8DCE3; --desk:#F3F4F6;
  --charcoal:#2B2D2F; --charcoal-deep:#121314;
  --var:#2F6FED; --var-soft:#E6EEFF;
  --go:#2EAD5B; --go-deep:#1F8A45; --go-soft:#E7F7EC;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:40rem;margin:0 auto;padding:1.6rem 1.2rem 4rem}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 .3rem}
.intro{color:var(--ink-2);margin:0 0 1.4rem}
.unit{margin:0 0 2.2rem}
.unit-head{border:2px solid var(--var);border-radius:1rem;padding:.6rem 1rem;text-align:center;box-shadow:0 .2rem 0 var(--var);margin-bottom:1rem}
.unit-head small{display:block;color:var(--var);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.unit-head b{font-size:1.05rem}
.path{list-style:none;margin:0;padding:0;position:relative}
.node{display:flex;align-items:center;gap:1rem;padding:.55rem 0;position:relative}
.node:nth-child(4n+2){margin-left:18%} .node:nth-child(4n+3){margin-left:32%} .node:nth-child(4n+4){margin-left:18%}
.node a{display:flex;align-items:center;gap:1rem;color:inherit;text-decoration:none;border-radius:1rem;padding:.2rem .6rem .2rem .2rem}
.node a:hover .dot{transform:translateY(-2px)}
.node a:focus-visible{outline:3px solid var(--var);outline-offset:3px}
.dot{width:4rem;height:4rem;flex:none;border-radius:50%;display:grid;place-items:center;background:#E9ECEF;box-shadow:inset 0 -.35rem 0 #D2D7DE;transition:transform .15s;font-weight:700;color:var(--ink-2)}
.dot svg{width:1.6rem;height:1.6rem}
.label{line-height:1.3}
.label b{display:block;font-weight:600}
.label small{color:var(--ink-2)}
.node.done .dot{background:var(--go);box-shadow:inset 0 -.35rem 0 var(--go-deep);color:#fff}
.node.next .dot{background:var(--var);box-shadow:inset 0 -.35rem 0 #1F55C8,0 0 0 .4rem var(--var-soft);color:#fff}
.go{display:inline-block;margin-top:.35rem;background:var(--charcoal);color:#fff;border-radius:999px;padding:.35rem 1rem;font-weight:600;font-size:.9rem;box-shadow:0 .2rem 0 var(--charcoal-deep)}
.node.check .dot{background:#fff;border:2px dashed var(--line);box-shadow:none}
.node.check .label{color:var(--ink-2)}
.node.check span.link{display:flex;align-items:center;gap:1rem;padding:.2rem .6rem .2rem .2rem}
.foot{color:var(--ink-2);font-size:.85rem;border-top:1px solid var(--line);padding-top:1rem}
@media (max-width:30rem){ .node:nth-child(4n+2),.node:nth-child(4n+4){margin-left:10%} .node:nth-child(4n+3){margin-left:20%} .dot{width:3.4rem;height:3.4rem} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Algebra card lessons</h1>
  <p class="intro">Short interactive lessons. Start anywhere: the highlighted lesson is the suggested next one.</p>
  <div id="units"></div>
  <p class="foot">Ticks show lessons finished on this device and browser. A lesson can be updated without changing this map.</p>
</div>
<script>
(() => {
'use strict';
const MAP = {"title": "Algebra card lessons", "intro": "Short interactive lessons. Start anywhere: the highlighted lesson is the suggested next one.", "units": [{"id": "expressions", "title": "Variables and expressions", "year": 7, "lessons": ["what-is-a-variable", "writing-expressions", "substitution", "equivalent-expressions", "properties-with-letters"]}, {"id": "equations", "title": "Equations", "year": 7, "lessons": ["one-step-equations", "two-step-equations", "backtracking", "equations-from-stories"]}, {"id": "patterns", "title": "Patterns and rules", "year": 7, "lessons": ["growing-patterns", "tables-to-rules"]}, {"id": "year8", "title": "Expressions in Year 8", "year": 8, "lessons": ["like-terms", "area-model-expansion"]}], "lessons": {"what-is-a-variable": {"title": "What is a variable?", "description": "Year 7 card lesson on what a variable is, built around four things students move: a balance, a mat, a tile pattern and a number machine.", "year": 7, "ac9": "AC9M7A02", "version": 1, "href": "what-is-a-variable.html"}, "writing-expressions": {"title": "Writing expressions", "description": "Year 7 card lesson on writing expressions: an expression is a recipe for a number you do not know yet. Bags and marbles, think-of-a-number stories, brackets, less than, and a money context.", "year": 7, "ac9": "AC9M7A02", "version": 1, "href": "writing-expressions.html"}, "substitution": {"title": "Substitution", "description": "Year 7 card lesson on substitution: put the number where the letter was, then follow the order of operations. A formula machine, the 3n-is-not-34 trap, AFL scores, weekly pay, rectangle area, two letters at once and working backwards.", "year": 7, "ac9": "AC9M7A01", "version": 1, "href": "substitution.html"}, "equivalent-expressions": {"title": "Equivalent expressions", "description": "Year 7 card lesson on equivalent expressions: two machines on one slider show when expressions give the same number for every value of the variable.", "year": 7, "ac9": "AC9M7A02", "version": 1, "href": "equivalent-expressions.html"}, "properties-with-letters": {"title": "Properties with letters", "description": "Year 7 card lesson: letters state a rule about all numbers at once. Commutative and associative properties of addition and multiplication, and counterexamples for subtraction and division.", "year": 7, "ac9": "AC9M7A02", "version": 1, "href": "properties-with-letters.html"}, "one-step-equations": {"title": "One-step equations", "description": "Year 7 card lesson on one-step equations: an equation is a balance, whatever you do to one side you do to the other, and the solution is the number that makes it true.", "year": 7, "ac9": "AC9M7A03", "version": 1, "href": "one-step-equations.html"}, "two-step-equations": {"title": "Two-step equations", "description": "Year 7 card lesson on solving two-step equations on a balance: undo the loose marbles first, then share.", "year": 7, "ac9": "AC9M7A03", "version": 1, "href": "two-step-equations.html"}, "backtracking": {"title": "Backtracking", "description": "Year 7 card lesson on backtracking: find the input of a number machine by undoing each step in reverse order, then solve equations such as 3x + 7 = 19 and check by running forwards.", "year": 7, "ac9": "AC9M7A03", "version": 1, "href": "backtracking.html"}, "equations-from-stories": {"title": "Equations from stories", "description": "Year 7 card lesson on writing equations from everyday money stories: name the unknown as a number, write the equation, solve it, then check the answer in the story.", "year": 7, "ac9": "AC9M7A03", "version": 1, "href": "equations-from-stories.html"}, "growing-patterns": {"title": "Growing patterns", "description": "Year 7 card lesson on growing patterns: see the part that stays the same and the part that grows, then use a rule to find any step without drawing it.", "year": 7, "ac9": "AC9M7A05", "version": 1, "href": "growing-patterns.html"}, "tables-to-rules": {"title": "Tables to rules", "description": "Year 7 card lesson on finding the rule that links each input in a table of values to its output, built around a hidden number machine, rule tiles and a small grid.", "year": 7, "ac9": "AC9M7A05", "version": 1, "href": "tables-to-rules.html"}, "like-terms": {"title": "Like terms", "description": "Year 8 card lesson on like terms: you can only combine things of the same kind. Blue and purple bags of marbles, sliders and term sorting.", "year": 8, "ac9": "AC9M8A01", "version": 1, "href": "like-terms.html"}, "area-model-expansion": {"title": "Expanding with the area model", "description": "Year 8 card lesson on expanding and factorising a(b + c) as the area of a rectangle split into two parts, built around an area model students drag.", "year": 8, "ac9": "AC9M8A01", "version": 1, "href": "area-model-expansion.html"}}};
const TICK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const done = slug => { try { return JSON.parse(localStorage.getItem('card-lesson:' + slug + ':done')); } catch (_) { return null; } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const order = MAP.units.flatMap(u => u.lessons);
const next = order.find(s => !done(s));          // suggested next lesson: the first one not finished on this device
const host = document.getElementById('units');
let n = 0;
MAP.units.forEach((u, ui) => {
  const items = u.lessons.map(s => {
    n++;
    const L = MAP.lessons[s], d = done(s), cls = d ? 'done' : (s === next ? 'next' : '');
    const status = d ? 'Finished' + (d.total ? ', ' + d.first + ' of ' + d.total + ' first try' : '') : (s === next ? 'Suggested next' : 'Year ' + L.year);
    return '<li class="node ' + cls + '"><a href="' + esc(L.href) + '" aria-label="' + esc(L.title + ', ' + status) + '">' +
      '<span class="dot">' + (d ? TICK : n) + '</span>' +
      '<span class="label"><b>' + esc(L.title) + '</b><small>' + esc(status) + '</small>' + (s === next ? '<br><span class="go">Start</span>' : '') + '</span></a></li>';
  }).join('');
  const check = '<li class="node check"><span class="link"><span class="dot" aria-hidden="true">?</span><span class="label"><b>Level Check</b><small>Coming soon</small></span></span></li>';
  host.insertAdjacentHTML('beforeend',
    '<section class="unit"><div class="unit-head"><small>Unit ' + (ui + 1) + ' · Year ' + u.year + '</small><b>' + esc(u.title) + '</b></div>' +
    '<ol class="path">' + items + check + '</ol></section>');
});
})();
</script>
</body>
</html>
