<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Expanding with the area model</title>
<meta name="description" content="Year 8 card lesson on expanding and factorising a(b + c) as the area of a rectangle split into two parts, built around an area model students drag.">
<meta name="lesson-id" content="area-model-expansion">
<meta name="lesson-format" content="card">
<meta name="lesson-version" content="2">
<meta name="ac9-descriptor" content="AC9M8A01">
<meta name="sa-year" content="8">
<meta name="sa-strand" content="Algebra">
<style>

:root{
  /* Shared card frame. Approved style 17 Nov 2026: white page, sans-serif text, maths font for maths only,
     full-width Check in a bottom bar, feedback that slides up (green right, amber not yet).
     Colour carries meaning: blue is always the variable; yellow is always a known number;
     purple is a second variable in the same problem and means nothing else. */
  --ink:#1C1E21; --ink-2:#5F6670; --desk:#F3F4F6; --paper:#FFFFFF; --grid:#E6E9EE; --line:#D8DCE3;
  --charcoal:#2B2D2F; --charcoal-deep:#121314;
  --var:#2F6FED; --var-deep:#1F55C8; --var-soft:#E6EEFF;
  --var2:#8A2BB8; --var2-deep:#6B1F91; --var2-soft:#F2E3FA;
  --num:#FFCB3D; --num-deep:#D9A300; --num-soft:#FFF4D1;
  --go:#2EAD5B; --go-deep:#1F8A45; --go-soft:#E7F7EC;
  --no:#E0A100; --no-soft:#FFF4D6; --no-ink:#6B4E00;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:var(--body);
  --maths:"Schola","Century Schoolbook","Cambria","Georgia",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:clamp(15px,min(1.2vw + 6px,2.4vh + 1px),40px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font:400 1rem/1.5 var(--body);overflow:hidden}
button,input{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--var);outline-offset:3px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.wrap{width:100%;max-width:47rem;margin:0 auto;padding:0 1rem}

/* top bar */
.top{padding:.45rem 0 .2rem}
.top .wrap{position:relative}
.top-row{display:flex;align-items:center;gap:.4rem}
.title{flex:1;margin:0;font:700 1rem/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:2.1rem;height:2.1rem;flex:none;border:0;border-radius:.65rem;background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:1.15rem;height:1.15rem}
.icon-btn:hover{background:#DCE1EE}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.progress{display:flex;gap:3px;margin-top:.1rem}
.seg{flex:1;height:1.2rem;padding:0;border:0;background:none;cursor:pointer;position:relative;min-width:0}
.seg::after{content:"";position:absolute;left:0;right:0;top:50%;height:.45rem;margin-top:-.225rem;border-radius:.25rem;background:#D2D8E7;transition:background .25s}
.seg.sec{margin-left:.5rem}
.seg.done::after{background:var(--ink)}
.seg.now::after{background:var(--var);height:.7rem;margin-top:-.35rem;border-radius:.35rem}
.seg:disabled{cursor:default}
.menu{position:absolute;right:1rem;top:2.6rem;z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:1rem;padding:.4rem;box-shadow:0 12px 30px rgba(28,35,64,.18);display:grid;min-width:15rem}
.menu button{border:0;background:none;text-align:left;padding:.65rem .8rem;border-radius:.7rem;cursor:pointer}
.menu button:hover{background:var(--desk)}

/* card */
main{overflow:auto;overscroll-behavior:contain}
.card{display:flex;flex-direction:column;gap:.65rem;padding-top:.45rem;padding-bottom:1rem}
.prompt{margin:0;font:700 1.42rem/1.24 var(--display);text-wrap:balance}
.sub{margin:0;color:var(--ink-2);max-width:62ch;line-height:1.4}
.stage{position:relative;container-type:inline-size;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.5rem 1.5rem;background-position:-1px -1px;border:1px solid var(--line);border-radius:1.4rem;padding:.8rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;-webkit-user-select:none;user-select:none}
.ctl{display:flex;flex-direction:column;gap:.65rem;-webkit-user-select:none;user-select:none}

/* maths */
.m{font-family:var(--maths);white-space:nowrap;font-size:1.1em;font-variant-numeric:lining-nums}
i.v{font-style:italic;font-weight:400;color:var(--var);font-family:var(--maths)}
.prompt .m{font-size:1em;font-weight:400}

/* drawn objects */
.mb-b{fill:var(--num);stroke:var(--num-deep);stroke-width:1.5}
.mb-h{fill:#fff;opacity:.8}
.mb.rm{cursor:pointer}
.bag-body,.bag-neck{fill:var(--var);stroke:var(--var-deep);stroke-width:2;stroke-linejoin:round}
.bag-tie{fill:var(--var-deep)}
.bag.xray .bag-body{fill:var(--var-soft)}
.bag-txt{font:700 26px var(--maths);fill:#fff}
.bag-tag rect{fill:#fff;stroke:var(--var-deep);stroke-width:1.5}
.bag-tag line{stroke:var(--var-deep);stroke-width:1.5}
.bag-tag text{font:italic 400 15px var(--maths);fill:var(--var)}

/* balance */
.scale-wrap{width:min(100%,36rem,calc(34vh * 2.42))}
.scale{display:block;width:100%;height:auto;overflow:visible}
.sc-ink{fill:var(--ink)}
.sc-plate{fill:#8B95B4}
.sc-beam{transform-origin:280px 214.5px;transition:transform .6s cubic-bezier(.3,1.35,.5,1)}
.sc-pan{transition:transform .6s cubic-bezier(.3,1.35,.5,1)}
.sc-hit{fill:transparent}
.sc-hit.drop-hot{fill:var(--var-soft);stroke:var(--var);stroke-width:2;stroke-dasharray:6 5}
.sc-pivot{fill:var(--paper);stroke:var(--ink);stroke-width:4;transition:fill .3s}
.scale.level .sc-pivot{fill:var(--go)}
.eqbar{display:grid;grid-template-columns:35.6% 28.8% 35.6%;text-align:center;align-items:start;font-size:1.2rem;line-height:1.25;margin-top:.2rem}
.eqbar small{display:block;font-size:.85rem;color:var(--ink-2);font-family:var(--body)}
.eq-m{font-family:var(--maths);font-size:1.5rem;color:var(--ink-2)}
.eq-m.ok{color:var(--go);font-weight:700}
.eq-m.word{font-family:var(--body);font-size:.95rem;padding-top:.2rem}

/* slider */
.slider{display:flex;align-items:center;gap:.8rem;background:var(--paper);border:1px solid var(--line);border-radius:1rem;padding:.35rem 1rem}
.slider label{font-size:1.35rem;min-width:4.6rem;white-space:nowrap}
.slider .end{font-size:.85rem;color:var(--ink-2)}
.slider input{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:2.2rem;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:.55rem;border-radius:.3rem;background:linear-gradient(90deg,var(--var) var(--fill,0%),#D2D8E7 var(--fill,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--var);border:.22rem solid #fff;box-shadow:0 2px 6px rgba(28,35,64,.4);margin-top:-.63rem}
input[type=range]::-moz-range-track{height:.55rem;border-radius:.3rem;background:#D2D8E7}
input[type=range]::-moz-range-progress{height:.55rem;border-radius:.3rem;background:var(--var)}
input[type=range]::-moz-range-thumb{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--var);border:.22rem solid #fff;box-shadow:0 2px 6px rgba(28,35,64,.4)}

/* sources and mat */
.tray{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem 1rem}
.src{display:flex;align-items:center;gap:.6rem;text-align:left;background:var(--paper);border:0;border-radius:1rem;padding:.4rem 1rem .4rem .6rem;cursor:grab;touch-action:none;box-shadow:0 .22rem 0 var(--line),inset 0 0 0 2px var(--line);line-height:1.25}
.src:active{cursor:grabbing}
.src svg{width:2.5rem;height:2.5rem;flex:none}
.src small{display:block;color:var(--ink-2);font-size:.8rem}
.linkbtn{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:.5rem}
.mat{width:100%;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:.5rem .7rem;padding:.6rem;border-radius:1rem;border:2px dashed transparent}
.mat.droppable{border-color:var(--line);min-height:9.6rem}
.mat.drop-hot{border-color:var(--var);background:rgba(227,233,255,.65)}
.it{border:0;background:none;padding:0;display:block;line-height:0}
button.it{cursor:pointer}
.bagit svg{width:5.4rem;height:5.9rem;display:block}
.mbit svg{width:2.3rem;height:2.3rem;display:block}
.mbs{display:flex;flex-wrap:wrap-reverse;gap:.25rem;max-width:8rem;justify-content:center}
.mat-empty{align-self:center;color:var(--ink-2)}
.live{font-size:1.2rem;text-align:center;min-height:1.9rem;line-height:1.3}
.live .lab{font-size:.9rem;color:var(--ink-2);margin-right:.5rem}
.live small{display:block;font-size:.95rem;color:var(--ink-2)}
.note{background:var(--var-soft);border-radius:2rem;padding:.15rem .9rem;font-size:1.15rem}
.pic{height:8.5rem;display:block}

/* tiles */
.tile{min-width:3rem;height:3.1rem;padding:0 .6rem;border:0;border-radius:.75rem;display:inline-grid;place-items:center;font:400 1.5rem/1 var(--maths);cursor:grab;touch-action:none;margin-bottom:.22rem}
.tile.var{background:var(--var);color:#fff;font-style:italic;box-shadow:0 .22rem 0 var(--var-deep)}
.tile.num{background:var(--num);color:var(--ink);box-shadow:0 .22rem 0 var(--num-deep)}
.tile.op{background:var(--paper);color:var(--ink);box-shadow:0 .22rem 0 var(--line),inset 0 0 0 2px var(--line)}
.tile.still{cursor:default}
.strip{width:100%;min-height:4.3rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem;padding:.5rem .7rem .3rem;border:2px dashed var(--line);border-radius:1rem;background:rgba(255,255,255,.8)}
.strip .tile{cursor:pointer}
.strip.drop-hot{border-color:var(--var);background:var(--var-soft)}
.strip .ph{color:var(--ink-2);font-size:.95rem;padding-bottom:.2rem}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}

/* tile pattern */
.pat{display:flex;gap:.25rem;justify-content:center;align-items:flex-start;padding:.9rem 0 0;--pt:min(3rem,calc((100cqw - 5.5rem) / 14))}
.pt{flex:none;width:var(--pt);height:var(--pt);border-radius:.4rem}
.pt.e{background:var(--num);box-shadow:inset 0 -.2rem 0 var(--num-deep)}
.pt.n{background:var(--var);box-shadow:inset 0 -.2rem 0 var(--var-deep)}
.pat-mid{display:flex;flex-direction:column;align-items:stretch}
.pat-row{display:flex;gap:.25rem}
.brace{height:.5rem;margin-top:.35rem;border:2px solid var(--var);border-top:0;border-radius:0 0 .4rem .4rem}
.brace-l{text-align:center;font-size:1.15rem;white-space:nowrap;line-height:1.5}
.readout{font-size:1.1rem;text-align:center}

/* sorter */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%}
.bin{min-height:8.2rem;border:2px dashed var(--line);border-radius:1rem;padding:.5rem;display:flex;flex-direction:column;gap:.5rem;background:rgba(255,255,255,.8);cursor:pointer}
.bin.drop-hot{border-color:var(--var);background:var(--var-soft)}
.bin-h{border:0;background:none;font-weight:600;font-size:.95rem;padding:.2rem;cursor:pointer}
.bin-c{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;min-height:4rem;border-radius:1rem;padding:.2rem}
.chips.drop-hot{background:var(--var-soft)}
.chip{border:0;background:var(--paper);border-radius:.9rem;padding:.4rem .8rem .45rem;box-shadow:0 .22rem 0 var(--line),inset 0 0 0 2px var(--line);cursor:grab;touch-action:none;text-align:center;line-height:1.25;margin-bottom:.22rem}
.chip .m{display:block;font-size:1.3rem}
.chip small{color:var(--ink-2);font-size:.78rem}
.chip.sel{box-shadow:0 .22rem 0 var(--var-deep),inset 0 0 0 3px var(--var);background:var(--var-soft)}
.chip.bad{box-shadow:0 .22rem 0 var(--no),inset 0 0 0 3px var(--no);background:var(--no-soft);animation:shake .4s}
.chip.good{box-shadow:0 .22rem 0 var(--go),inset 0 0 0 3px var(--go);background:var(--go-soft)}

/* machine */
.mach{display:flex;align-items:center;justify-content:center;row-gap:2rem;width:100%;padding-top:1.6rem}
.m-slot{width:4.8rem;height:4.8rem;flex:none;border-radius:1rem;border:2px dashed var(--line);display:grid;place-items:center;background:rgba(255,255,255,.85);position:relative}
.m-slot .tile,.m-wide .tile{margin-bottom:0}
.cap{position:absolute;top:-1.5rem;left:0;right:0;text-align:center;font-size:.82rem;color:var(--ink-2)}
.m-in.drop-hot{border-color:var(--var);background:var(--var-soft)}
.m-pipe{flex:0 1 2.6rem;min-width:.8rem;height:.7rem;background:var(--ink)}
.m-body{width:8.6rem;height:6.4rem;flex:none;border-radius:1.4rem;background:var(--ink);display:grid;place-items:center}
.m-body svg{width:3.3rem;height:3.3rem}
.m-body.run svg{animation:spin .6s cubic-bezier(.4,0,.2,1)}
.m-wide{flex:1 1 12rem;min-width:11rem;position:relative}
.mach.wide{flex-wrap:wrap}
.m-log{display:flex;flex-wrap:wrap;gap:.4rem .5rem;justify-content:center;min-height:2.2rem}
.pair{font-family:var(--maths);font-size:1.1rem;background:var(--paper);border:1px solid var(--line);border-radius:.6rem;padding:.1rem .6rem;white-space:nowrap}
.pop{animation:pop .22s cubic-bezier(.3,1.5,.5,1)}

/* answers */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.choice{border:0;background:var(--paper);border-radius:1rem;padding:.7rem 1rem;text-align:left;cursor:pointer;box-shadow:0 .22rem 0 var(--line),inset 0 0 0 2px var(--line);min-height:3.3rem;margin-bottom:.22rem;line-height:1.3}
.choice .m{font-size:1.35rem}
.choice[aria-pressed=true]{box-shadow:0 .22rem 0 var(--var-deep),inset 0 0 0 3px var(--var);background:var(--var-soft)}
.choice.bad{box-shadow:0 .22rem 0 var(--no),inset 0 0 0 3px var(--no);background:var(--no-soft)}
.choice.good{box-shadow:0 .22rem 0 var(--go-deep),inset 0 0 0 3px var(--go);background:var(--go-soft)}
.choice:disabled{cursor:default;color:var(--ink)}
.answer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem .8rem;font-size:1.05rem}
.answer input{width:6rem;font:400 1.5rem var(--maths);text-align:center;padding:.3rem .5rem;border:2px solid var(--line);border-radius:.8rem;background:var(--paper);-webkit-user-select:text;user-select:text}
.answer input:focus{outline:3px solid var(--var);outline-offset:2px;border-color:var(--var)}
.answer input.bad{border-color:var(--no);background:var(--no-soft)}
.answer input.good{border-color:var(--go);background:var(--go-soft)}
.claims{display:grid;gap:.45rem}
.claim{background:var(--paper);border:2px solid var(--line);border-radius:1rem;padding:.5rem .9rem;display:grid;grid-template-columns:auto 1fr auto;gap:.5rem .9rem;align-items:center}
.av{width:2.2rem;height:2.2rem;border-radius:50%;background:#DCE1EE;display:grid;place-items:center;font:700 1.05rem var(--display)}
.claim p{margin:0;line-height:1.4}
.claim .who{font-weight:600}
.claim.bad{border-color:var(--no);background:var(--no-soft)}
.claim.good{border-color:var(--go);background:var(--go-soft)}
.claim .why{grid-column:2 / -1;font-size:.93rem;line-height:1.35}
.yn{display:inline-flex;border-radius:.8rem;box-shadow:inset 0 0 0 2px var(--line);background:var(--paper);overflow:hidden}
.yn button{border:0;background:none;padding:.5rem .85rem;cursor:pointer;font-size:.93rem}
.yn button[aria-pressed=true]{background:var(--ink);color:#fff}
.yn button:disabled{cursor:default}

/* dock */
.dock{background:var(--paper);border-top:1px solid var(--line);transition:background .25s}
.dock .wrap{display:flex;align-items:center;gap:1rem;min-height:4.5rem;padding-top:.65rem;padding-bottom:.8rem}
.dock.good{background:var(--go-soft)}
.dock.bad{background:var(--no-soft)}
.dock.info{background:var(--var-soft)}
.fb{flex:1;min-width:0;display:flex;gap:.7rem;align-items:flex-start;font-size:.96rem;line-height:1.4}
.fb.in{animation:rise .22s ease-out}
.fb .ic{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;margin-top:.1rem}
.fb .ic svg{width:1rem;height:1rem}
.good .ic{background:var(--go)} .bad .ic{background:var(--no)} .info .ic{background:var(--var)}
.verdict{display:block;font-weight:700}
.good .verdict{color:var(--go-deep)} .bad .verdict{color:var(--no)} .info .verdict{color:var(--var-deep)}
.acts{display:flex;gap:.6rem;flex:none;align-items:center;justify-content:flex-end}
.btn{font-weight:600;font-size:1.05rem;border:0;border-radius:.9rem;padding:.7rem 1.5rem;cursor:pointer;white-space:nowrap}
.primary{background:var(--ink);color:#fff;box-shadow:0 .25rem 0 #080C20;margin-bottom:.25rem}
.primary:active:not(:disabled){transform:translateY(.18rem);box-shadow:0 .07rem 0 #080C20}
.primary:disabled{background:#C3C9DA;box-shadow:0 .25rem 0 #AAB1C6;color:#F3F5FA;cursor:not-allowed}
.dock.good .primary{background:var(--go);box-shadow:0 .25rem 0 var(--go-deep)}
.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:.25rem}
.ghost:hover{background:rgba(255,255,255,.6)}

/* recap */
.recap{display:grid;gap:.6rem;width:100%;margin:0;padding:0;list-style:none}
.recap li{display:grid;grid-template-columns:4.6rem 1fr;gap:.9rem;align-items:center;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:.9rem;padding:.55rem .8rem;line-height:1.4}
.recap .art{display:flex;justify-content:center;align-items:flex-end;gap:.15rem}
.recap .art svg{height:2.7rem;display:block}
.recap .art .pt{width:.85rem;height:.85rem;border-radius:.2rem;box-shadow:none}
.recap .art .tile{min-width:1.35rem;height:1.6rem;padding:0 .2rem;font-size:1rem;border-radius:.4rem;box-shadow:none;margin:0;cursor:default}

.drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;margin:0 !important;animation:none !important;transform:translate(-50%,-50%) scale(1.08) !important;filter:drop-shadow(0 8px 10px rgba(28,35,64,.28))}
.drag-ghost svg{width:2.6rem;height:2.6rem;display:block}
.dragging{opacity:.45}

@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(.5rem);opacity:0}}
@media (max-width:34rem){
  .choices{grid-template-columns:1fr}
  .dock .wrap{flex-direction:column;align-items:stretch;gap:.5rem}
  .claim{grid-template-columns:auto 1fr}
  .claim .yn{grid-column:2;justify-self:start}
  .mach.wide .p2{display:none}
  .prompt{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.icon-btn:hover{background:var(--desk)}

.seg.now::after{background:#9EDDB5;height:.62rem;margin-top:-.31rem;border-radius:.31rem;box-shadow:0 0 0 2px var(--go)}
.count{min-width:3.2rem;text-align:right}

.card{padding-bottom:.6rem}

.tools{display:flex;justify-content:flex-end;margin-top:-.4rem}
.again{border:0;background:none;color:var(--ink-2);font-size:.95rem;cursor:pointer;padding:.3rem .5rem;border-radius:.6rem;display:inline-flex;align-items:center;gap:.35rem}
.again:hover{background:var(--desk);color:var(--ink)}

<script>
(() => {
'use strict';

/* ---------- lesson settings (written by build_cards.py) ---------- */
const LESSON = {"slug": "area-model-expansion", "title": "Expanding with the area model", "version": 2, "map": "index.html", "next": {"title": "Level Check: Expressions in Year 8", "href": "check-year8.html"}};

/* ===================== this lesson: helpers, components, cards ===================== */
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// "3(x + 4)" -> maths markup. Every lower-case letter becomes a variable, so pass maths only, never words.
function mx(s) {
  return '<span class="m">' + String(s).replace(/[a-z]/g, t => '<i class="v">' + t + '</i>') + '</span>';
}

/* ---------- drawn objects ---------- */
function marbleG(cx, cy, r, cls) {
  return '<g class="mb' + (cls ? ' ' + cls : '') + '"><circle class="mb-b" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
    '<ellipse class="mb-h" cx="' + (cx - r * 0.32) + '" cy="' + (cy - r * 0.36) + '" rx="' + (r * 0.28) + '" ry="' + (r * 0.18) + '"/></g>';
}
// A 62 x 70 bag with its top-left corner at (x, y). o.inside = n draws a see-through bag holding n marbles.
function bagG(x, y, o) {
  o = o || {};
  const xray = o.inside != null;
  let g = '<g class="bag' + (xray ? ' xray' : '') + '" transform="translate(' + x + ',' + y + ')">' +
    '<path class="bag-neck" d="M20 16 L15 4 Q23 9 31 4 Q39 9 47 4 L42 16 Z"/>' +
    '<path class="bag-body" d="M19 15 C8 25 3 40 5 52 C7 64 18 69 31 69 C44 69 55 64 57 52 C59 40 54 25 43 15 Z"/>' +
    '<rect class="bag-tie" x="17" y="12" width="28" height="6.5" rx="3.2"/>';
  if (xray) {
    for (let k = 0; k < o.inside; k++) {
      const row = Math.floor(k / 4), inRow = Math.min(4, o.inside - row * 4), col = k % 4;
      g += marbleG(31 + (col - (inRow - 1) / 2) * 11, 59 - row * 11, 5);
    }
  } else if (o.body) {
    g += '<text class="bag-txt" x="31" y="53" text-anchor="middle">' + o.body + '</text>';
  }
  if (o.tag) g += '<g class="bag-tag"><line x1="44" y1="14" x2="52" y2="8"/><rect x="45" y="-7" width="21" height="19" rx="5"/><text x="55.5" y="7.5" text-anchor="middle">' + o.tag + '</text></g>';
  return g + '</g>';
}
const SVG_MARBLE = '<svg viewBox="0 0 30 30" aria-hidden="true">' + marbleG(15, 15, 12.5) + '</svg>';
const svgBag = o => '<svg viewBox="-5 -10 76 83" aria-hidden="true">' + bagG(0, 0, o) + '</svg>';
const GEAR = '<svg viewBox="-24 -24 48 48" aria-hidden="true"><g fill="#fff"><circle r="13"/>' +
  [0, 1, 2, 3, 4, 5, 6, 7].map(i => '<rect x="-4.5" y="-21" width="9" height="11" rx="2" transform="rotate(' + i * 45 + ')"/>').join('') +
  '</g><circle r="5.5" fill="#2B2D2F"/></svg>';

/* ---------- drag engine (pointer events: mouse, touch, pen) ---------- */
function dropAt(x, y, accept) {
  for (const n of document.elementsFromPoint(x, y)) {
    const t = n.closest ? n.closest('[data-drop]') : null;
    if (t && accept.includes(t.getAttribute('data-drop'))) return t;
  }
  return null;
}
function draggable(node, opt) {
  node.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (node.disabled) return;
    const sx = e.clientX, sy = e.clientY;
    let g = null, hot = null;
    const move = ev => {
      if (!g) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 7) return;
        if (opt.ghost) g = h('<div>' + opt.ghost() + '</div>');
        else { g = node.cloneNode(true); g.removeAttribute('id'); g.style.width = node.getBoundingClientRect().width + 'px'; }
        g.classList.add('drag-ghost');
        document.body.append(g);
        node.classList.add('dragging');

      g.style.left = ev.clientX + 'px';
      g.style.top = ev.clientY + 'px';
      const t = dropAt(ev.clientX, ev.clientY, opt.accept);
      if (t !== hot) { if (hot) hot.classList.remove('drop-hot'); hot = t; if (hot) hot.classList.add('drop-hot'); }
    };

      node.removeEventListener('pointermove', move);
      node.removeEventListener('pointerup', end);
      node.removeEventListener('pointercancel', end);
      if (!g) return;                       // it was a tap: the click handler deals with it
      g.remove();
      node.classList.remove('dragging');
      if (hot) hot.classList.remove('drop-hot');
      const stop = c => { c.stopImmediatePropagation(); c.preventDefault(); };
      node.addEventListener('click', stop, true);
      setTimeout(() => node.removeEventListener('click', stop, true), 60);
      if (ev.type === 'pointerup' && hot) opt.onDrop(hot, ev);
    };
    try { node.setPointerCapture(e.pointerId); } catch (_) {}
    node.addEventListener('pointermove', move);
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', end);
  });

/* ---------- components ---------- */
function makeScale(host, o) {
  o = o || {};
  const wrap = h('<div class="scale-wrap"><svg class="scale" viewBox="16 66 528 218" role="img" aria-label="Balance scale">' +
    '<rect class="sc-ink" x="205" y="262" width="150" height="14" rx="7"/><path class="sc-ink" d="M280 212 L310 264 L250 264 Z"/>' +
    '<g class="sc-beam"><rect class="sc-ink" x="102" y="208" width="356" height="13" rx="6.5"/></g>' +
    '<g class="sc-pan"><rect class="sc-ink" x="104" y="184" width="12" height="30" rx="3"/><rect class="sc-hit" x="20" y="62" width="180" height="140" rx="16"/><rect class="sc-plate" x="25" y="178" width="170" height="11" rx="5.5"/><g class="sc-load"></g></g>' +
    '<g class="sc-pan"><rect class="sc-ink" x="444" y="184" width="12" height="30" rx="3"/><rect class="sc-hit" x="360" y="62" width="180" height="140" rx="16"/><rect class="sc-plate" x="365" y="178" width="170" height="11" rx="5.5"/><g class="sc-load"></g></g>' +
    '<circle class="sc-pivot" cx="280" cy="214.5" r="9"/></svg>' +
    '<div class="eqbar"><div class="eq-l"></div><div class="eq-m"></div><div class="eq-r"></div></div></div>');

  function loadHTML(cx, L) {
    const bags = L.bags || [], n = L.loose || 0;
    const cols = bags.length ? (bags.length > 1 ? 2 : 3) : 5;
    const used = Math.min(n, cols);
    const bw = bags.length * 62 + Math.max(0, bags.length - 1) * 6, lw = used * 26;

    if (bw && lw) x += 4;
    for (let k = 0; k < n; k++) {

    }

  }
  return {
    // L and R: { bags: [bag options], loose: n, weight: n, removable: bool }
    update(L, R) {
      $('.sc-load', pans[0]).innerHTML = loadHTML(110, L);
      $('.sc-load', pans[1]).innerHTML = loadHTML(450, R);
      const diff = R.weight - L.weight;
      const a = 10 * Math.tanh(diff / 3) * Math.PI / 180;      // positive: right side goes down

// Tile expression builder. Tiles alternate operand, operator, operand ...
const tileKind = t => /^[a-z]$/.test(t) ? 'var' : /^\d+$/.test(t) ? 'num' : 'op';

function evalToks(toks, v, val) {
  if (!toks.length || toks.length % 2 === 0) return null;
  const a = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (i % 2 === 0) { if (t === v) a.push(val); else if (/^\d+$/.test(t)) a.push(+t); else return null; }
    else { if (t !== '+' && t !== '×') return null; a.push(t); }
  }
  let sum = 0, cur = a[0];
  for (let i = 1; i < a.length; i += 2) { if (a[i] === '×') cur *= a[i + 1]; else { sum += cur; cur = a[i + 1]; } }
  return sum + cur;
}
function makeBuilder(stripHost, trayHost, tiles, ctx) {

    draw(); ctx.touch(true);
  }
  function draw() {
    strip.replaceChildren();

      b.onclick = () => { if (locked) return; toks.splice(i, 1); draw(); ctx.touch(toks.length > 0); };

    b.onclick = () => insert(t);

}

/* ---------- area model ---------- */
// A rectangle drawn to scale: height a, length cut into parts. Drag the bottom edge (a), the split line (p) or the right edge (q),
// or tap the ruler beside them. Blue parts are lengths in x, yellow parts are known numbers, a hatched part has been cut off.
// spec: { a, aLab, total, parts: [{ x, len, kind, area, hl, hlLab }], top: [{ x, len, lab }], bot, ticks, split, qFrom, grid }
function makeArea(host, o) {
  const drag = o.drag || {};
  const node = h('<div class="am" style="--ml:' + o.maxLen + ';--ma:' + o.maxA + ';--ah:' + (o.h || 6.5) + 'rem">' +
    '<div class="am-top"></div><div class="am-side"></div><div class="am-rect"><div class="am-parts" role="img"></div></div><div class="am-bot"></div></div>');
  const top = $('.am-top', node), side = $('.am-side', node), rect = $('.am-rect', node), partsEl = $('.am-parts', node), bot = $('.am-bot', node);
  const NAMES = { a: 'Height', p: 'Split line', q: 'Right edge' };
  const handles = {};
  let spec = null, locked = false;
  const val = k => k === 'a' ? spec.a : k === 'p' ? spec.split : spec.total - spec.qFrom;
  function set(k, v) {
    if (locked) return;
    v = Math.max(drag[k][0], Math.min(drag[k][1], Math.round(v)));
    if (v !== val(k)) o.onDrag(k, v);
  }
  function at(k, ev) {
    const r = rect.getBoundingClientRect(), u = r.width / spec.total;
    set(k, k === 'a' ? (ev.clientY - r.top) / u : (ev.clientX - r.left) / u - (k === 'q' ? spec.qFrom : 0));
  }
  function start(k, el, e, jump) {
    if (locked || !spec || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const move = ev => at(k, ev);
    const end = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', end); el.removeEventListener('pointercancel', end); };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    if (jump) at(k, e);                    // a tap on the ruler moves the edge straight there
  }
  Object.keys(drag).forEach(k => {
    const b = h('<button type="button" class="am-h am-h-' + k + '" role="slider" aria-label="' + ((o.names && o.names[k]) || NAMES[k]) + '" aria-valuemin="' + drag[k][0] + '" aria-valuemax="' + drag[k][1] + '"></button>');
    b.addEventListener('pointerdown', e => start(k, b, e, false));
    b.addEventListener('keydown', e => {
      const d = { ArrowRight: 1, ArrowLeft: -1, ArrowUp: k === 'a' ? -1 : 1, ArrowDown: k === 'a' ? 1 : -1 }[e.key];
      if (d && spec) { e.preventDefault(); set(k, val(k) + d); }
    });
    rect.append(b);
    handles[k] = b;
  });
  if (drag.a) { side.classList.add('track'); side.addEventListener('pointerdown', e => start('a', side, e, true)); }
  const hk = drag.p ? 'p' : drag.q ? 'q' : null;
  if (hk) { top.classList.add('track'); top.addEventListener('pointerdown', e => start(hk, top, e, true)); }
  host.append(node);
  const pos = (x, len) => 'left:calc(var(--u) * ' + x + ');width:calc(var(--u) * ' + len + ')';
  const lens = list => (list || []).map(t => '<span class="am-len" style="' + pos(t.x, t.len) + '">' + t.lab + '</span>').join('');
  const plain = s => String(s == null ? '' : s).replace(/<[^>]*>/g, '');
  return {
    draw(s) {
      spec = s;
      rect.style.width = 'calc(var(--u) * ' + s.total + ')';
      rect.style.height = 'calc(var(--u) * ' + s.a + ')';
      partsEl.innerHTML = s.parts.map(p => '<div class="am-part ' + p.kind + (p.kind === 'var' && s.grid === false ? ' plain' : '') + '" style="' + pos(p.x, p.len) + '">' +
          (p.hl ? '<div class="am-hl" style="height:calc(var(--u) * ' + p.hl + ')">' + (p.hlLab || '') + '</div>' : '') +
          '<span class="am-lab">' + (p.area == null ? '' : p.area) + '</span></div>').join('') +
        (s.ticks || []).map(t => '<div class="am-tick" style="left:calc(var(--u) * ' + t + ')"></div>').join('');
      top.innerHTML = lens(s.top);
      bot.innerHTML = lens(s.bot);
      side.innerHTML = '<span class="am-len" style="height:calc(var(--u) * ' + s.a + ')">' + s.aLab + '</span>';
      if (handles.a) { handles.a.style.top = 'calc(var(--u) * ' + s.a + ')'; handles.a.setAttribute('aria-valuenow', s.a); }
      if (handles.p) { handles.p.style.left = 'calc(var(--u) * ' + s.split + ')'; handles.p.setAttribute('aria-valuenow', s.split); }
      if (handles.q) { handles.q.style.left = 'calc(var(--u) * ' + s.total + ')'; handles.q.setAttribute('aria-valuenow', s.total - s.qFrom); }
      partsEl.setAttribute('aria-label', 'Rectangle, ' + plain(s.aLab) + ' tall and ' + s.top.map(t => plain(t.lab)).join(' plus ') + ' long. Areas inside: ' +
        s.parts.map(p => plain(p.area) || 'not shown').join(', ') + '.');
    },
    lock() { locked = true; node.classList.add('locked'); }
  };
}

// Parts laid end to end along the length, as in a(b + c).
function lay(a, aLab, parts, extra) {
  let x = 0;
  const ps = parts.map(p => { const q = Object.assign({ x: x }, p); x += p.len; return q; });
  return Object.assign({ a: a, aLab: aLab, total: x, parts: ps, top: ps.map(p => ({ x: p.x, len: p.len, lab: p.lab })), split: ps[0].len, qFrom: ps[0].len }, extra);
}

function layCut(a, aLab, len, cut, o) {
  return { a: a, aLab: aLab, total: len, ticks: o.ticks,
    parts: [{ x: 0, len: len - cut, kind: 'var', area: o.keep }, { x: len - cut, len: cut, kind: 'cut', area: o.cut }],
    top: [{ x: 0, len: len - cut, lab: o.keepLab }, { x: len - cut, len: cut, lab: o.cutLab }],
    bot: [{ x: 0, len: len, lab: o.lab }] };

        if (a !== 2) return 'The blue part is ' + a + ' tall and ' + mx('x') + ' long, so its area is ' + mx(term(a)) + '. You need ' + mx('2x') + '. Set the height first.';
        return 'The blue part is right. The yellow part is 2 × ' + q + ' = ' + 2 * q + '. You need 4.';
      },
      win: () => 'Height 2 and length ' + mx('x + 2') + ' give areas ' + mx('2x') + ' and 4. So ' + mx('2x + 4 = 2(x + 2)') + '. Writing a sum as a product like this is called factorising.',
      won() { am.lock(); },
      solve() { a = 2; q = 2; draw(); }
    };
  }
},

/* 13 */ {
  prompt: 'This rectangle has area ' + mx('6x + 9') + '. Drag its height to factorise it.',
  why: () => whyBox(stillArea({ maxLen: 7, maxA: 3, h: 4.2 }, lay(3, '3', [
      { len: 4, kind: 'var', lab: mx('2x'), area: mx('6x') }, { len: 3, kind: 'num', lab: '3', area: '9' }], { grid: false })), [
    'Factors of 6: 1, 2, 3, 6. Factors of 9: 1, 3, 9. The biggest number in both lists is 3.',
    'Divide each area by the height to get its length: ' + mx('6x ÷ 3 = 2x') + ' and ' + mx('9 ÷ 3 = 3') + '.'
  ]),
  then: {
    prompt: 'Check it. When ' + mx('x = 2') + ', what is the area of the whole rectangle?',
    sub: 'Use ' + mx('6x + 9') + ' or ' + mx('3(2x + 3)') + '. They should agree.',
    reset: false,
    why: () => whyBox(stillArea({ maxLen: 7, maxA: 3, h: 4.2 }, lay(3, '3', [
        { len: 4, kind: 'var', lab: mx('2x = 4'), area: '12' }, { len: 3, kind: 'num', lab: '3', area: '9' }])), [
      'When ' + mx('x = 2') + ', the blue length ' + mx('2x') + ' is 4. The rectangle is 3 by 7, which is 21 squares.',
      'Counting the two parts finds the same squares: ' + mx('6 × 2 + 9 = 12 + 9 = 21') + '.'
    ]),
    build(stage, ctl, ctx, p1) {
      const ans = makeAnswer(ctl, 'Area when ' + mx('x = 2'), ctx);
      return {
        check() {
          const v = ans.value();
          if (v === 21) return true;
          ans.mark('bad');
          if (isNaN(v)) return 'Type a whole number, using digits only.';
          if (v === 71) return mx('6x') + ' means 6 × ' + mx('x') + ', not a 6 with a 2 written after it. 6 × 2 = 12, then add 9.';
          if (v === 12) return 'That is the blue part, 6 × 2. Add the yellow part, 9.';
          if (v === 17) return '6 + 2 + 9 adds the 6 and the 2. ' + mx('6x') + ' means 6 × ' + mx('x') + ', so the blue part is 6 × 2 = 12.';
          if (v === 7) return '7 is the length, 2 × 2 + 3. The rectangle is 3 tall, so multiply the length by 3.';
          if (v === 15) return 'Check each number. The blue length ' + mx('2x') + ' is 2 × 2 = 4, not 2, and the yellow area is 9, not 3.';
          return 'Swap each ' + mx('x') + ' for 2: 6 × 2 + 9. Or use the rectangle: 3 tall and 2 × 2 + 3 long.';
        },
        win: () => 'Both forms give 21: ' + mx('6 × 2 + 9 = 21') + ' and ' + mx('3 × (2 × 2 + 3) = 3 × 7 = 21') + '. Factorising changes how the expression is written, not its value.',
        won() {
          ans.mark('good'); ans.lock();
          p1.am.draw(lay(3, '3', [{ len: 4, kind: 'var', lab: mx('2 × 2 = 4'), area: '12' }, { len: 3, kind: 'num', lab: '3', area: '9' }], { grid: false }));
          p1.live.innerHTML = '<span class="lab">When ' + mx('x = 2') + '</span>' + mx('12 + 9 = 21') + ' &nbsp; ' + mx('3 × 7 = 21');
        },
        solve() { ans.set(21); }
      };
    }
  },
  sub: 'The areas stay the same, so the lengths change. Find the biggest height that gives no decimals in the lengths.',
  build(stage, ctl, ctx) {
    const X = 2;
    let a = 1;
    const am = makeArea(stage, { maxLen: 21, maxA: 6, h: 10, drag: { a: [1, 6] }, onDrag(k, v) { a = v; draw(); ctx.touch(true); } });
    const live = h('<div class="live"></div>');
    stage.append(live);
    function draw() {
      const c = 6 / a, k = 9 / a;
      am.draw(lay(a, String(a), [{ len: c * X, kind: 'var', lab: mx(term(c)), area: mx('6x') }, { len: k, kind: 'num', lab: dec(k), area: '9' }], { grid: false }));
      live.innerHTML = mx('6x + 9 = ' + a + '(' + term(c) + ' + ' + dec(k) + ')');
    }
    draw();
    const why = {
      1: 'Height 1 always works, because ' + mx('6x + 9 = 1(6x + 9)') + '. That doesn’t simplify anything. Look for a bigger height.',
      2: 'The yellow length is 9 ÷ 2 = 4.5, a decimal. 2 does not divide 9.',
      4: 'The lengths are ' + mx('1.5x') + ' and 2.25. 4 does not divide 6 or 9.',
      5: 'The lengths are ' + mx('1.2x') + ' and 1.8. 5 does not divide 6 or 9.',
      6: 'The blue length is ' + mx('x') + ', but the yellow length is 9 ÷ 6 = 1.5. 6 does not divide 9.'
    };
    return {
      check() { return a === 3 ? true : why[a]; },
      win: () => 'Height 3 gives lengths ' + mx('2x') + ' and 3, so ' + mx('6x + 9 = 3(2x + 3)') + '. 3 is the highest common factor of 6 and 9: the biggest number that divides both.',
      won() { am.lock(); },
      solve() { a = 3; draw(); },
      recap: () => mx('6x + 9 = 3(2x + 3)'),
      am, live

  }
},

/* 14 */ {
  bridge: true,
  prompt: 'You started with the areas, ' + mx('6x + 9') + ', and found the height and length, ' + mx('3(2x + 3)') + '. Putting the brackets back like this is called <b>factorising</b>. It is expanding in reverse.',
  show(stage) {
    bridgeArea(stage, { maxLen: 7, maxA: 3, h: 5 }, lay(3, '3', [{ len: 4, kind: 'var', lab: mx('2x'), area: mx('6x') }, { len: 3, kind: 'num', lab: '3', area: '9' }], { grid: false }),
      mx('6x + 9 = 3(2x + 3)'));
  }
},

/* 15 */ {
  prompt: 'Tap every expression that equals ' + mx('4x + 8') + '.',
  why: () => whyBox(
    stillArea({ maxLen: 4, maxA: 4, h: 4.2 }, lay(4, '4', [{ len: 2, kind: 'var', lab: mx('x'), area: mx('4x') }, { len: 2, kind: 'num', lab: '2', area: '8' }], { grid: false })) +
    stillArea({ maxLen: 8, maxA: 2, h: 2.1 }, lay(2, '2', [{ len: 4, kind: 'var', lab: mx('2x'), area: mx('4x') }, { len: 4, kind: 'num', lab: '4', area: '8' }], { grid: false })), [
    'Both rectangles hold ' + mx('4x') + ' and 8, so ' + mx('4(x + 2)') + ' and ' + mx('2(2x + 4)') + ' both equal ' + mx('4x + 8') + '.',
    mx('4(x + 8)') + ' would hold ' + mx('4 × 8 = 32') + ' in its yellow part, and ' + mx('8(x + 1)') + ' would hold ' + mx('8x') + ' in its blue part.'
  ]),
  sub: 'Expand each one to check.',
  build(stage, ctl, ctx) {
    stage.hidden = true;
    const ch = makeChoices(ctl, [mx('4(x + 2)'), mx('4(x + 8)'), mx('2(2x + 4)'), mx('8(x + 1)')], ctx, true);
    return {
      check() {
        const s = ch.sel(), has = i => s.includes(i);
        const bad = [1, 3].filter(has);
        if (!bad.length && has(0) && has(2)) return true;
        bad.forEach(i => ch.mark(i, 'bad'));
        const msg = [];
        if (has(1)) msg.push(mx('4(x + 8)') + ' expands to ' + mx('4x + 32') + '. The 4 multiplies the 8 too, so the bracket needs 8 ÷ 4 = 2.');
        if (has(3)) msg.push(mx('8(x + 1)') + ' expands to ' + mx('8x + 8') + '. Its ' + mx('x') + ' term is ' + mx('8x') + ', not ' + mx('4x') + '.');
        if (msg.length) return msg.join(' ');
        if (!has(0)) return 'Expand ' + mx('4(x + 2)') + ' yourself: 4 × ' + mx('x') + ' and 4 × 2. Does it match?';
        return 'Expand ' + mx('2(2x + 4)') + ' yourself: 2 × ' + mx('2x') + ' and 2 × 4. Does it match?';
      },
      win: () => mx('4(x + 2)') + ' and ' + mx('2(2x + 4)') + ' both equal ' + mx('4x + 8') + '. ' + mx('4(x + 2)') + ' uses the highest common factor, 4, so it is called fully factorised.',
      won() { ch.mark(0, 'good'); ch.mark(2, 'good'); ch.lock(); },
      solve() { ch.set([0, 2]); }
    };
  }
},

/* 16 */ {
  prompt: 'Three students expand ' + mx('4(2x + 5)') + '. Who is right?',
  why: () => whyBox(stillArea({ maxLen: 9, maxA: 4, h: 4.8 }, lay(4, '4', [
      { len: 4, kind: 'var', lab: mx('2x'), area: mx('8x') }, { len: 5, kind: 'num', lab: '5', area: '20', hl: 1, hlLab: 'Mia’s 5' }], { grid: false })), [
    'Mia’s 5 is one row of the yellow part. It has 4 rows: ' + mx('4 × 5 = 20') + '.',
    'Lena can’t join the two parts into ' + mx('28x') + ': the blue area changes with ' + mx('x') + ', but the yellow area is always 20.'
  ]),
  sub: 'Choose Agree or Disagree for each one.',
  build(stage, ctl, ctx) {
    stage.hidden = true;
    const claims = [
      { who: 'Mia', say: '“' + mx('4(2x + 5) = 8x + 5') + '. The 4 goes with the ' + mx('2x') + ', because that’s the term next to it.”', agree: false, hint: 'Picture a rectangle 4 tall. What is the area of the part that is 5 long?', why: 'The 4 multiplies the whole bracket. On a rectangle 4 tall, the part 5 long has area 4 × 5 = 20, not 5.' },
      { who: 'Tom', say: '“' + mx('4(2x + 5) = 8x + 20') + '. The rectangle is 4 tall, so both parts get multiplied by 4.”', agree: true, hint: 'Test Tom’s answer and ' + mx('4(2x + 5)') + ' with ' + mx('x = 1') + '. Do they match?', why: 'This is the distributive law: 4 × ' + mx('2x') + ' + 4 × 5.' },
      { who: 'Lena', say: '“It’s ' + mx('8x + 20') + ', and that simplifies to ' + mx('28x') + '.”', agree: false, hint: 'Test ' + mx('8x + 20') + ' and ' + mx('28x') + ' with ' + mx('x = 2') + '. Do they match?', why: mx('8x') + ' and 20 are not like terms, so they can’t be added. When ' + mx('x = 2') + ', ' + mx('8x + 20') + ' is 36 but ' + mx('28x') + ' is 56.' }
    ];
    const pick = claims.map(() => null);
    let locked = false;
    const list = h('<div class="claims"></div>');
    const rows = claims.map((c, i) => {
      const row = h('<div class="claim"><span class="av" aria-hidden="true">' + c.who[0] + '</span><p><span class="who">' + c.who + ':</span> ' + c.say + '</p><div class="yn" role="group" aria-label="' + c.who + '">' +
        '<button type="button" aria-pressed="false">Agree</button><button type="button" aria-pressed="false">Disagree</button></div></div>');
      const btns = row.querySelectorAll('.yn button');
      btns.forEach((b, k) => { b.onclick = () => { if (locked) return; pick[i] = k === 0; paint(i); ctx.touch(pick.every(p => p !== null)); }; });
      list.append(row);
      return { row, btns };
    });
    function paint(i) {
      const r = rows[i];
      r.btns[0].setAttribute('aria-pressed', pick[i] === true);
      r.btns[1].setAttribute('aria-pressed', pick[i] === false);
      r.row.classList.remove('bad', 'good');
      const w = $('.why', r.row); if (w) w.remove();
    }
    const explain = (i, cls, txt) => { rows[i].row.classList.add(cls); const w = $('.why', rows[i].row); if (w) w.remove(); rows[i].row.append(h('<p class="why">' + txt + '</p>')); };
    ctl.append(list);
    return {
      check() {
        const wrong = claims.map((c, i) => pick[i] !== c.agree ? i : -1).filter(i => i >= 0);
        if (!wrong.length) return true;
        wrong.forEach(i => explain(i, 'bad', claims[i].hint));
        return wrong.length === 1 ? 'Look again at what ' + claims[wrong[0]].who + ' said. The note under it gives a hint.'
                                  : 'Look again at ' + wrong.map(i => claims[i].who).join(' and ') + '. The notes under them give hints.';
      },
      win: () => 'Tom has it. Mia multiplied only the first term in the bracket, and Lena added terms that are not alike. ' + mx('4(2x + 5) = 8x + 20') + ': the number outside multiplies every term inside.',
      won() { locked = true; claims.forEach((c, i) => { rows[i].row.classList.remove('bad'); explain(i, 'good', c.why); rows[i].btns.forEach(b => { b.disabled = true; }); }); },
      solve() { claims.forEach((c, i) => { pick[i] = c.agree; paint(i); }); }
    };
  }
}
];

const SECTIONS = [[0, 'Numbers'], [2, 'Letters'], [6, 'Expanding'], [9, 'Subtraction'], [11, 'Factorising'], [13, 'Two forms'], [15, 'Wrap-up']];

// Finish screen: sets the prompt, sub-line and recap for this lesson.
function drawFinish() {
  promptEl.textContent = 'To expand a bracket, multiply every term inside it.';
  subEl.hidden = false; subEl.textContent = 'Four things to remember:';
  ctl.replaceChildren(); stage.hidden = false;
  // Small area models: 'split' a(b + c), 'row' the one-row trap, 'cut' a strip removed.
  const mini = t => '<svg class="mini" viewBox="0 0 46 30" aria-hidden="true">' +
    (t === 'cut' ? '<rect class="v" x="2" y="2" width="30" height="26"/><rect class="c" x="32" y="2" width="12" height="26"/>'
                 : '<rect class="v" x="2" y="2" width="26" height="26"/><rect class="n" x="28" y="2" width="16" height="26"/>') +
    (t === 'row' ? '<rect class="o" x="28" y="2" width="16" height="8.7"/>' : '') + '<rect class="o" x="2" y="2" width="42" height="26"/></svg>';
  stage.replaceChildren(h('<ul class="recap">' +
    '<li><span class="art">' + mini('split') + '</span><span>' + mx('a(b + c)') + ' is the area of a rectangle split into two parts, so it equals ' + mx('ab + ac') + '.</span></li>' +
    '<li><span class="art">' + mini('row') + '</span><span>The number outside multiplies <b>every</b> term: ' + mx('3(x + 4) = 3x + 12') + ', not ' + mx('3x + 4') + '.</span></li>' +
    '<li><span class="art">' + mini('cut') + '</span><span>A minus sign works the same way. Cut a strip off: ' + mx('4(x − 2) = 4x − 8') + '.</span></li>' +
    '<li><span class="art">' + mini('split') + '</span><span>Factorising runs it backwards. Use the highest common factor as the height: ' + mx('6x + 9 = 3(2x + 3)') + '.</span></li></ul>'));
}


/* ===================== shared card engine ===================== */
// A card is { prompt, sub, build(stage, ctl, ctx) } and build returns { check(attempt), win(), won(), solve() }.
// Optional on a card: why (string or function: the Why? panel), reset: false (hide Start over),
// bridge: true (a screen between groups of cards that names the idea just met; no check, not scored; optional
// show(stage) draws a still diagram under the text),
// then: { prompt, sub, why, reset, build(stage, ctl, ctx, part1) } (a second question on the same card, shown once
// part 1 is right: part 1's prompt shrinks to a recap line, the stage stays, and build gets part 1's controller;
// part 1's controller may add recap() returning HTML for that line), from: '<lesson slug>' (Level Checks: the lesson
// the question comes from, for the review list at the end).
// LESSON.kind === 'check' makes a Level Check: no Show me; a second wrong answer shows the answer and moves on.
const sectionOf = i => SECTIONS.filter(s => s[0] <= i).pop() || [0, ''];
const KEY = 'card-lesson:' + LESSON.slug + ':v' + LESSON.version;
const DONE_KEY = 'card-lesson:' + LESSON.slug + ':done';
const fresh = () => ({ i: 0, done: [], first: [], unlocked: false });
let S = fresh();
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved.i === 'number' && Array.isArray(saved.done)) S = Object.assign(fresh(), saved); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };

const part1El = $('#part1'), cardEl = $('#card'), promptEl = $('#prompt'), subEl = $('#sub'), stage = $('#stage'), ctl = $('#ctl'), dock = $('#dock'), fb = $('#fb');
const primary = $('#primary'), showMe = $('#showMe'), skip = $('#skip'), back = $('#back'), progress = $('#progress'), count = $('#count');
const tools = $('#startOver'), startOver = $('#startOver'), whyBtn = $('#whyBtn'), whyWrap = $('#why'), whyBody = $('#whyBody'), whyOk = $('#whyOk'), againBtn = $('#again');
const menu = $('#menu'), menuBtn = $('#menuBtn');
$('#close').href = LESSON.map;
const ICON = {
  good: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 10a5.5 5.5 0 1 1-1.7-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14.6 2.6v3.8h-3.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  info: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="5" r="1.6" fill="currentColor"/><path d="M10 9v7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>'
};
const VERDICT = { good: 'Correct!', bad: 'Not yet.', info: 'Here’s how it works.' };
let ctrl = null, attempts = 0, mode = 'check', fbKind = null, part = 0, partFirst = true;
const IS_CHECK = LESSON.kind === 'check';
const partSpec = () => { const c = cards[S.i]; return part ? c.then : c; };
const scored = () => cards.map((_, k) => k).filter(k => !cards[k].bridge);

function setFb(kind, html, verdict) {
  fbKind = kind;
  dock.className = 'dock' + (kind ? ' ' + kind : '');
  fb.className = 'fb' + (kind ? ' in' : '');
  fb.innerHTML = kind ? '<span class="ic">' + ICON[kind] + '</span><div><span class="verdict">' + (verdict || VERDICT[kind]) + '</span>' + html + '</div>' : '';
}
// After the sheet opens, move focus to the main button, late enough that the key which opened it can't press it.
function focusPrimary() { setTimeout(() => { if (!primary.disabled && whyWrap.hidden) primary.focus({ preventScroll: true }); }, 200); }
function focusCard() { const el = cardEl.querySelector('input:not([disabled]), [tabindex="0"]'); if (el) el.focus({ preventScroll: true }); }
const ctx = {
  // A card calls touch() whenever its state changes. ready = there is something to check.
  touch(ready) {
    if (mode === 'retry') { mode = 'check'; setFb(null); primary.textContent = 'Check'; }
    if (mode !== 'check') return;
    primary.disabled = !ready;
    if (fbKind === 'bad') setFb(null);
  },
  submit() { if (!primary.disabled && mode === 'check') primary.click(); }
};
const cardWhy = () => { const c = cards[S.i] && partSpec(); if (!c || !c.why) return ''; return typeof c.why === 'function' ? c.why() : c.why; };

function drawProgress() {
  const firstOpen = cards.findIndex((_, k) => !S.done[k]);
  const reach = firstOpen < 0 ? cards.length : firstOpen;
  [...progress.children].forEach((b, k) => {
    b.className = 'seg' + (k && SECTIONS.some(s => s[0] === k) ? ' sec' : '') + (S.done[k] ? ' done' : '') + (k === S.i ? ' now' : '');
    b.disabled = !(S.unlocked || k <= reach);
    if (k === S.i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  count.textContent = S.i < cards.length ? (S.i + 1) + ' / ' + cards.length : 'Finished';
  back.disabled = S.i === 0;
}

function render() {
  if (S.i >= cards.length) return renderFinish();
  const c = cards[S.i];
  attempts = 0; mode = 'check'; part = 0; partFirst = true;
  part1El.hidden = true; part1El.replaceChildren(); cardEl.classList.remove('part2');
  cardEl.classList.toggle('bridge', !!c.bridge);
  promptEl.innerHTML = c.prompt;
  subEl.innerHTML = c.sub || ''; subEl.hidden = !c.sub;
  stage.hidden = false; stage.replaceChildren(); ctl.replaceChildren();
  setFb(null);
  primary.textContent = 'Check'; primary.disabled = true;
  showMe.hidden = true; whyBtn.hidden = true; againBtn.hidden = true;
  skip.hidden = !(S.done[S.i] || S.unlocked);
  if (c.bridge) {
    ctrl = null; mode = 'done'; tools.hidden = true;
    stage.hidden = !c.show; if (c.show) c.show(stage);
    cardEl.classList.toggle('shows', !!c.show);
    S.done[S.i] = true; S.first[S.i] = true;
    primary.textContent = S.i === cards.length - 1 ? 'Finish' : 'Continue'; primary.disabled = false; skip.hidden = true;
  } else {
    tools.hidden = c.reset === false;
    ctrl = c.build(stage, ctl, ctx);
  }
  drawProgress(); save();
  $('#main').scrollTop = 0;
}

function finishCard(kind, first, verdict) {
  mode = 'done';
  const c = cards[S.i], more = !!c.then && part === 0;
  if (more) partFirst = first;
  else if (!S.done[S.i]) { S.done[S.i] = true; S.first[S.i] = !!(first && partFirst); }
  if (ctrl.won) ctrl.won();
  setFb(kind, ctrl.win(), verdict);
  primary.textContent = more || S.i < cards.length - 1 ? 'Continue' : 'Finish';
  primary.disabled = false;
  showMe.hidden = true; skip.hidden = true; tools.hidden = true;
  whyBtn.hidden = !cardWhy();
  if (!whyBtn.hidden) { const v = fb.querySelector('.verdict'); if (v) v.append(whyBtn); }
  drawProgress(); save();
  focusPrimary();
}

// Part 2 of a two-part card: part 1 shrinks to a recap line, the stage stays, new controls replace the old.
function toPart2() {
  const c = cards[S.i], p1 = ctrl;
  part = 1; attempts = 0; mode = 'check';
  part1El.innerHTML = ICON.good + '<span>' + (p1 && p1.recap ? p1.recap() : c.prompt) + '</span>';
  part1El.hidden = false; cardEl.classList.add('part2');
  promptEl.innerHTML = c.then.prompt;
  subEl.innerHTML = c.then.sub || ''; subEl.hidden = !c.then.sub;
  ctl.replaceChildren(); setFb(null);
  primary.textContent = 'Check'; primary.disabled = true;
  showMe.hidden = true; whyBtn.hidden = true; skip.hidden = true;
  tools.hidden = c.then.reset === false;
  ctrl = c.then.build(stage, ctl, ctx, p1);
  save();
  $('#main').scrollTop = 0;
  focusCard();
}

function renderFinish() {
  ctrl = null; mode = 'finish';
  cardEl.classList.remove('bridge'); tools.hidden = true; whyBtn.hidden = true;
  const ks = scored();
  const done = ks.filter(k => S.done[k]).length, firsts = ks.filter(k => S.first[k]).length;
  if (IS_CHECK) {
    checkFinish(ks, firsts);
    setFb('good', done === ks.length ? 'Your result shows on the course map with a tick.' : 'Answer every question to get the tick on the course map.', 'Level Check finished.');
  } else {
    drawFinish();
    setFb('good', 'You completed ' + done + ' of ' + ks.length + ' cards and got ' + firsts + ' right on the first try.', 'Lesson finished.');
  }
  if (done === ks.length) {
    try { localStorage.setItem(DONE_KEY, JSON.stringify({ date: new Date().toISOString().slice(0, 10), first: firsts, total: ks.length, version: LESSON.version })); } catch (_) {}
  }
  primary.textContent = LESSON.next ? 'Next lesson: ' + LESSON.next.title : 'Back to the course map';
  primary.disabled = false;
  showMe.hidden = true; skip.hidden = true; againBtn.hidden = false;
  drawProgress(); save();
  $('#main').scrollTop = 0;
}

// Level Check finish: score, then each lesson the questions came from, with the ones to revisit highlighted.
function checkFinish(ks, firsts) {
  promptEl.innerHTML = 'You got ' + firsts + ' of ' + ks.length + ' right first time.';
  subEl.innerHTML = 'Questions you missed point back to the lesson they came from.'; subEl.hidden = false;
  stage.hidden = false; stage.replaceChildren(); ctl.replaceChildren();
  const by = {};
  ks.forEach(k => { const f = cards[k].from || ''; (by[f] = by[f] || { n: 0, ok: 0 }).n++; if (S.first[k]) by[f].ok++; });
  const titles = LESSON.review || {};
  const rows = Object.keys(by).filter(f => f).map(f => {
    const r = by[f], miss = r.ok < r.n, t = titles[f] || f;
    return '<li class="' + (miss ? 'miss' : '') + '">' + (miss ? '<a href="' + f + '.html">' + t + '</a>' : '<span>' + t + '</span>') +
      '<small>' + r.ok + ' of ' + r.n + (miss ? ' · revisit' : '') + '</small></li>';
  }).join('');
  stage.append(h('<div class="lc-score" aria-hidden="true">' + firsts + ' / ' + ks.length + '</div>'));
  if (rows) stage.append(h('<ul class="lc-list">' + rows + '</ul>'));
}

function go(i) { S.i = Math.max(0, Math.min(cards.length, i)); render(); }
function restart() { S = fresh(); render(); }

primary.addEventListener('click', () => {
  if (mode === 'finish') { location.href = LESSON.next ? LESSON.next.href : LESSON.map; return; }
  if (mode === 'done') { if (cards[S.i] && cards[S.i].then && part === 0) return toPart2(); return go(S.i + 1); }
  if (mode === 'retry') { mode = 'check'; setFb(null); primary.textContent = 'Check'; primary.disabled = true; focusCard(); return; }
  attempts++;
  const r = ctrl.check(attempts);
  if (r === true) return finishCard('good', attempts === 1);
  if (IS_CHECK && attempts >= 2) { ctrl.solve(); return finishCard('info', false, 'Here’s the answer.'); }
  setFb('bad', r);
  mode = 'retry'; primary.textContent = 'Try again'; primary.disabled = false;
  if (attempts >= 2 && !IS_CHECK) showMe.hidden = false;
  focusPrimary();
});
showMe.addEventListener('click', () => { ctrl.solve(); finishCard('info', false); });
skip.addEventListener('click', () => go(S.i + 1));
back.addEventListener('click', () => { closeMenu(); go(S.i - 1); });
againBtn.addEventListener('click', () => restart());
// Start over redraws the card. Tries already used still count, so it can't reset "Show me" or the first-try score.
startOver.addEventListener('click', () => {
  if (mode !== 'check' && mode !== 'retry') return;
  const used = attempts, inPart2 = part === 1, pf = partFirst;
  render();
  if (inPart2) { ctrl.solve(); if (ctrl.won) ctrl.won(); toPart2(); partFirst = pf; }
  attempts = used; showMe.hidden = !(used >= 2) || IS_CHECK;
});
whyBtn.addEventListener('click', () => { whyBody.innerHTML = cardWhy(); whyWrap.hidden = false; whyOk.focus(); });
whyOk.addEventListener('click', () => { whyWrap.hidden = true; primary.focus({ preventScroll: true }); });

cards.forEach((_, k) => {
  const b = h('<button type="button" class="seg" aria-label="Card ' + (k + 1) + ' of ' + cards.length + ', ' + sectionOf(k)[1] + '"></button>');
  b.addEventListener('click', () => go(k));
  progress.append(b);
});

const closeMenu = () => { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); };
menuBtn.addEventListener('click', e => {
  e.stopPropagation();
  menu.hidden = !menu.hidden;
  menuBtn.setAttribute('aria-expanded', String(!menu.hidden));
  $('#unlock').textContent = S.unlocked ? 'Lock cards again' : 'Unlock all cards (teacher)';
});
document.addEventListener('click', e => { if (!menu.hidden && !e.target.closest('#menu')) closeMenu(); });
$('#restart').addEventListener('click', () => { closeMenu(); restart(); });
$('#unlock').addEventListener('click', () => { S.unlocked = !S.unlocked; closeMenu(); render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); if (!whyWrap.hidden) whyOk.click(); }
  if (e.key === 'Enter' && !e.target.closest('button, input, a, textarea, select') && !primary.disabled && whyWrap.hidden) primary.click();
});

// Test hook for cards/check_cards.py: only when the page is opened with ?test.
if (/[?&]test\b/.test(location.search)) window.__T = { get cards() { return cards; }, go, get ctrl() { return ctrl; }, finishCard, get mode() { return mode; }, nextPart: toPart2, get part() { return part; }, kind: LESSON.kind || 'lesson' };

render();
})();
</script>
