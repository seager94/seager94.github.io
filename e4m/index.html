  }

  // ---- parent summary (dashboard §5.2) — one pure projection, two renders --
  // Everything here is qualitative or a simple count: no raw response times,
  // no speed targets, no normative comparison (§5.3). Thresholds are judgment
  // calls flagged in the build notes.
  const ADD_PHASE_LABEL = { 0: 'count on', 1: 'doubles', 2: 'pairs to ten', 3: 'make ten', 4: 'near doubles', 5: 'mixed adding' };
  function parentFocus(profile) {
    const acq = Content.allFactIds().filter(id => profile.facts[id].state === 'acquiring');
    if (!acq.length) return null;
    let recent = acq[0], t = -1;
    for (const id of acq) if (profile.facts[id].lastSeen > t) { t = profile.facts[id].lastSeen; recent = id; }
    const op = Content.parse(recent).op;
    const inOp = acq.filter(id => Content.parse(id).op === op);
    if (op === 'mul') {
      const leads = [...new Set(inOp.map(id => { const { a, b } = Content.parse(id); return Content.leadFactor(a, b); }))]
        .sort((x, y) => Content.introIdx(x) - Content.introIdx(y)).slice(0, 3);
      return 'Multiplication \u2014 ' + leads.map(n => '\u00D7' + n).join(', ');
    }
    if (op === 'div') return 'Division';
    if (op === 'sub') return 'Subtraction';
    const phases = [...new Set(inOp.map(id => { const { a, b } = Content.parse(id); return Content.addPhaseRank(a, b); }))]
      .sort((x, y) => x - y).slice(0, 3);
    return 'Addition \u2014 ' + phases.map(r => ADD_PHASE_LABEL[r]).join(', ');
  }
  function parentSummary(profile, todayIso) {
    const today = todayIso || isoDay(Clock.now());
    const ops = opSummary(profile);
    // journey status per operation: done >= 90% secure; in progress once
    // anything in the operation has started; otherwise coming (judgment)
    const journey = {};
    for (const op of ['add', 'sub', 'mul', 'div']) {
      const [k, t] = ops[op];
      const started = k > 0 || Content.allFactIds().some(id => Content.parse(id).op === op && profile.facts[id].state !== 'new');
      journey[op] = (t && k / t >= 0.9) ? 'done' : (started ? 'progress' : 'coming');
    }
    const real = profile.sessions.filter(s => s.domain !== 'placement');
    const week = real.filter(s => { const d = daysBetween(s.date, today); return d >= 0 && d <= 6; }).length;
    // accuracy over the last <=5 real sessions, mapped to plain language
    const last5 = real.slice(-5);
    let att = 0, cor = 0;
    for (const s of last5) { att += s.attempted; cor += s.correct; }
    const accuracy = att === 0 ? null : (cor / att >= 0.9 ? 'high' : cor / att >= 0.75 ? 'good' : 'building');
    // getting quicker: mean of last 2 real sessions vs the 2 before, shown
    // only as a qualitative tick and only when clearly true (never negative)
    const timed = real.filter(s => s.meanMs > 0);
    let quicker = false;
    if (timed.length >= 4) {
      const avg = (arr) => arr.reduce((a, s) => a + s.meanMs, 0) / arr.length;
      quicker = avg(timed.slice(-2)) < avg(timed.slice(-4, -2)) * 0.97;
    }
    return { focus: parentFocus(profile), journey, secure: ops, week, regular: week >= 3, accuracy, quicker, today };
  }

  return {
    newProfile, applyAttempt,
    isFluentOrAbove, isEligible, newPool,
    additionDoubleIds, doublesAllFluent, fluentFraction, maybeAdvanceDomain,
    buildSession, buildFocusedSession, runSession, updateStreak,
    choiceUnlocked, mulTableIds, tableUnlocked, tableHelper, suggestedTable,
    seedStateFromProbe, placementProbeIds, placementPhaseAIds, placementPhaseBIds, phaseBFromProbes,
    seedFromProbeResults, runReducedPlacement, REDUCED_SAMPLE, MUL_SAMPLE,
    collectionCounts, domainProgress, featuredFamilyPair, trendNote, nearlyAutomatic, completedTables, rowComplete, opSummary, parentSummary, parentFocus, familyTriples,
    canPromoteToFluent, canPromoteToAutomatic, isoDay, daysBetween
  };
})();

/* ===========================================================================
 * STORE  — the only code that knows localStorage + JSON (build plan §3).
 *   load/save/validate (version-checked), export/import (the v1 loss net).
 * ==========================================================================*/
const Store = (() => {
  const KEY = 'eager4maths_profile_v1';
  const hasLS = () => (typeof localStorage !== 'undefined');
  function validate(obj) {
    return !!obj && obj.version === 1 && !!obj.facts && !!obj.settings && Array.isArray(obj.sessions);
  }
  // Fill any missing fields against a fresh template so an older or partial
  // backup (e.g. one exported before a field existed) can't crash the UI when
  // it later reads f.everFluent / placementResolved / etc. Idempotent.
  function normalize(obj) {
    const t = Engine.newProfile();
    const out = {
      version: 1,
      createdAt: obj.createdAt || t.createdAt,
      name: typeof obj.name === 'string' ? obj.name : '',
      settings: Object.assign({}, t.settings, obj.settings || {}),
      facts: {},
      sessions: Array.isArray(obj.sessions) ? obj.sessions : [],
      streak: Object.assign({}, t.streak, obj.streak || {}),
      lastIntroducedId: obj.lastIntroducedId != null ? obj.lastIntroducedId : null,
      placementResolved: obj.placementResolved != null
        ? obj.placementResolved
        : (Array.isArray(obj.sessions) && obj.sessions.length > 0), // legacy: used => resolved
      attemptLog: Array.isArray(obj.attemptLog) ? obj.attemptLog : [],
      lastBackupAt: obj.lastBackupAt != null ? obj.lastBackupAt : null,
      lastBackupPromptAt: obj.lastBackupPromptAt != null ? obj.lastBackupPromptAt : null,
      // running tally of a session in progress (UI.stashOpen); closed out on
      // the next open if the student left mid-way. null when none.
      openSession: (obj.openSession && typeof obj.openSession === 'object') ? obj.openSession : null
    };
    const src = obj.facts || {};
    for (const id of Content.allFactIds()) {
      const f = Object.assign({}, t.facts[id], src[id] || {});
      if (!Array.isArray(f.recent)) f.recent = [];
      out.facts[id] = f;
    }
    return out;
  }
  function load() {
    try { if (!hasLS()) return null; const raw = localStorage.getItem(KEY); if (!raw) return null; const obj = JSON.parse(raw); return validate(obj) ? normalize(obj) : null; }
    catch (e) { return null; }
  }
  function save(p) {
    try { if (!hasLS()) return false; localStorage.setItem(KEY, JSON.stringify(p)); return true; }
    catch (e) { return false; }
  }
  function exportJSON(p) { return JSON.stringify(p, null, 2); }
  function importJSON(text) { const obj = JSON.parse(text); if (!validate(obj)) throw new Error('invalid profile'); return normalize(obj); }
  // migrate(): future versions bump `version` and transform here. v1 = identity.
  function migrate(obj) { return obj; }
  return { KEY, validate, normalize, load, save, exportJSON, importJSON, migrate };
})();

/* ===========================================================================
 * DEBUG  — test/sim harness. Gated out of production at Checkpoint B.
 *   validateContent, runTests, checkInvariants, simulate.
 * ==========================================================================*/
const Debug = (() => {
  function reseed(seed) { Rng = makeRng(seed >>> 0); }
  function tester() { const fails = []; return { a: (c, m) => { if (!c) fails.push(m); }, fails }; }

  // ---- content integrity (build plan §3 / engine §9 TODO 4) --------------
  function chainTerminates(id, idSet, seen) {
    seen = seen || new Set();
    if (seen.has(id)) return false;                 // cycle
    seen.add(id);
    const hs = Content.helpersOf(id);
    if (!hs.length) return true;
    return hs.every(h => idSet.has(h) && chainTerminates(h, idSet, new Set(seen)));
  }
  function validateContent() {
    const { a, fails } = tester();
    const ids = Content.allFactIds(), idSet = new Set(ids);
    for (const id of ids) {
      for (const h of Content.helpersOf(id)) a(idSet.has(h), `helper "${h}" of "${id}" is not in the universe`);
      const { op } = Content.parse(id);
      if (op === 'mul') {                            // §9 TODO 4: mul helpers must precede
        for (const h of Content.helpersOf(id)) {
          if (Content.parse(h).op === 'mul') a(Content.leadIdxOf(h) < Content.leadIdxOf(id), `precedence: "${h}" does not precede "${id}" in INTRO_ORDER`);
        }
      }
      a(chainTerminates(id, idSet), `helper chain for "${id}" does not terminate (cycle/dangling)`);
    }
    // Placement probe sets must be real universe ids — a non-canonical id
    // (e.g. "mul_5_4" for "mul_4_5") is asked but silently never seeded.
    for (const pid of Engine.placementProbeIds()) a(idSet.has(pid), `placement probe "${pid}" is not a canonical universe id`);
    return { pass: fails.length === 0, failures: fails };
  }

  // ---- runtime invariants ------------------------------------------------
  function checkInvariants(p) {
    const { a, fails } = tester();
    for (const id of Content.allFactIds()) {
      const f = p.facts[id];
      a(!(f.state === 'new' && f.attempts > 0), `invariant: "${id}" is new but has attempts>0`);
      a(['new', 'acquiring', 'fluent', 'automatic'].includes(f.state), `invariant: "${id}" has bad state "${f.state}"`);
      a(!(f.everAutomatic && !f.everFluent), `invariant: "${id}" everAutomatic without everFluent`);
      // An attempts-0 fact can only be `new` (never presented) or `fluent`
      // (basal-credited/inferred at placement, §3/§4). It must never be
      // `acquiring` or `automatic` with zero presentations. The old invariant
      // ("everFluent => attempts>0") was FALSE against basal credit and only
      // ever ran at sim-end, so it silently masked the violation.
      a(!(f.attempts === 0 && (f.state === 'acquiring' || f.state === 'automatic')), `invariant: "${id}" has attempts 0 but state ${f.state}`);
    }
    a(p.streak.longest >= p.streak.current, 'invariant: streak.longest < streak.current');
    a(!p.attemptLog || p.attemptLog.length <= (p.settings.attemptLogCap || 5000), 'invariant: attemptLog exceeds its cap');

    const P = () => Engine.newProfile();
    const feed = (p, id, seq) => seq.forEach(x => Engine.applyAttempt(p, id, { correct: x.c, ms: x.ms, sessionId: x.s, ts: 1 }));
    const toFluent = (p, id) => feed(p, id, [{ c: true, ms: 1000, s: 's1' }, { c: true, ms: 1000, s: 's1' }, { c: true, ms: 1000, s: 's2' }]);

    let p;

  // ---- simulator ---------------------------------------------------------
  // studentModel(factId) -> {correct, ms}. opts.placement: 'skip'|'reduced'.
  function simulate(studentModel, nSessions, opts) {
    opts = opts || {};
    reseed(opts.seed != null ? opts.seed : 12345);
    const savedNow = Clock.now;
    let day = Date.UTC(2026, 0, 1);
    Clock.now = () => day;                                // sim clock
    try {
      let p = Engine.newProfile();
      if (opts.placement === 'reduced') p = Engine.runReducedPlacement(p, studentModel);
      const transitionAt = { session: null };
      const DAYMS = 86400000;
      for (let i = 0; i < nSessions; i++) {
        day += DAYMS;                                     // a session per day
        const before = p.settings.currentDomain;
        const plan = Engine.buildSession(p);
        Engine.runSession(p, plan, studentModel, 'sess_' + i);
        Engine.updateStreak(p, Engine.isoDay(day));
        if (before === 'add_sub' && p.settings.currentDomain === 'mul_div' && transitionAt.session === null) transitionAt.session = i;
      }
      const counts = (pred) => Content.allFactIds().filter(pred).length;
      const byState = (st) => counts(id => p.facts[id].state === st);
      const opState = (op, st) => counts(id => Content.parse(id).op === op && p.facts[id].state === st);
      return {
        final: p,
        summary: {
          sessions: nSessions,
          finalDomain: p.settings.currentDomain,
          transitionAtSession: transitionAt.session,
          states: { new: byState('new'), acquiring: byState('acquiring'), fluent: byState('fluent'), automatic: byState('automatic') },
          autoMul: opState('mul', 'automatic'), autoDiv: opState('div', 'automatic'),
          streak: p.streak.current
        }
      };
    } finally { Clock.now = savedNow; }
  }

  // ---- integration assertions (exit criterion) ---------------------------
  function runSimChecks() {
    const { a, fails } = tester();
    const perfect = () => ({ correct: true, ms: 800 });
    const anchors = (id) => { const { op, a: x, b: y } = Content.parse(id); return (op === 'add' && Math.min(x, y) <= 1) ? { correct: true, ms: 800 } : { correct: false, ms: 4000 }; };

    let s1 = simulate(perfect, 80, { placement: 'skip' });
    a(s1.final.sessions.length === 80, 'SIM1 ran 80 sessions');
    a(s1.summary.states.automatic > 0, 'SIM1 perfect student reaches some automatic facts');
    a(checkInvariants(s1.final).pass, 'SIM1 invariants hold');

    let s2 = simulate(perfect, 420, { placement: 'reduced' });
    a(s2.summary.finalDomain === 'mul_div', 'SIM2 perfect student eventually transitions to mul_div');
    const divAhead = Content.allFactIds().filter(id => {
      if (Content.parse(id).op !== 'div') return false;
      const f = s2.final.facts[id];
      if (!(f.state === 'fluent' || f.state === 'automatic')) return false;
      const pf = s2.final.facts[Content.helpersOf(id)[0]];
      return !(pf.state === 'fluent' || pf.state === 'automatic');
    });
    a(divAhead.length === 0, 'SIM2 no division fact runs ahead of its multiplication parent');
    a(checkInvariants(s2.final).pass, 'SIM2 invariants hold');

    let s3 = simulate(anchors, 60, { placement: 'skip' });
    a(s3.summary.finalDomain === 'add_sub', 'SIM3 anchors-only student never transitions');

    return { pass: fails.length === 0, failures: fails, samples: { s1: s1.summary, s2: s2.summary, s3: s3.summary } };
  }

  return { reseed, validateContent, checkInvariants, runTests, simulate, runSimChecks };
})();

    else if (fill > 0) inner = `<clipPath id="${id}"><rect x="0" y="0" width="12" height="24"/></clipPath><path d="${STAR}" fill="var(--gold-fill)" clip-path="url(#${id})"/><path d="${STAR}" fill="none" stroke="var(--gold-edge)" stroke-width="1.1" stroke-linejoin="round"/>`;
    else inner = `<path d="${STAR}" fill="none" stroke="var(--star-outline)" stroke-width="1.6" stroke-linejoin="round"/>`;
    const badge = refresh ? `<circle cx="19.6" cy="4.8" r="4.7" fill="var(--refresh)"/><text x="19.6" y="7.4" text-anchor="middle" font-size="7.4" fill="#fff">\u21BB</text>` : '';
    return `<svg class="glyph" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${inner}${badge}</svg>`;
  }
  function lockSvg(size) { size = size || 24; return `<svg class="glyph" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="var(--lock)"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="var(--lock)" stroke-width="2"/></svg>`; }
  function glyphFor(f, size) {
    // Never-shrink fidelity (dashboard §3/§6.3): a slipped automatic fact
    // KEEPS its full gold star and wears the ↻ badge; only hard, repeated
    // failure (falling all the way to acquiring) demotes the visible label,
    // and even then it reads as refreshing, not lost.
    if (f.state === 'automatic') return starSvg(1, false, size);
    if (f.everAutomatic) return starSvg(f.state === 'fluent' ? 1 : 0.5, true, size);
    if (f.state === 'fluent') return starSvg(0.5, false, size);
    if (f.everFluent) return starSvg(0.5, true, size);     // slipped can-do: keeps its half star
    if (f.state === 'acquiring') return starSvg(0, false, size); // genuinely learning
    return lockSvg(size);
  }

  /* ---- strategy pictures: draw a Content `vis` descriptor as inline SVG -- */
  // Concrete-then-abstract: the picture carries the same move the self-talk
  // says. Counts are exact (Debug T38d), so the picture never contradicts
  // the worked example beside it.
  function visSvg(v, label) {
    if (!v) return '';
    const wrap = (w, h, inner) => `<svg class="vis" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label || 'A picture of the strategy')}">${inner}</svg>`;
    if (v.k === 'rows') {
      const P = 21, R = 8;                                   // pitch, radius
      const cols = Math.max.apply(null, v.rows.map(r => r.n + (r.x || 0)));
      let y = R + 2, out = '', prev = null;
      for (const r of v.rows) {
        if (prev !== null && prev !== r.c) y += 9;           // the split between groups is a gap, not only a colour
        for (let i = 0; i < r.n; i++) out += `<circle class="vd v${r.c}" cx="${R + 2 + i * P}" cy="${y}" r="${R}"/>`;
        for (let i = 0; i < (r.x || 0); i++) out += `<circle class="vd vx" cx="${R + 2 + (r.n + i) * P + 5}" cy="${y}" r="${R}"/>`;
        prev = r.c; y += P;
      }
      return wrap((cols - 1) * P + 2 * R + 9, y - P + R + 2, out);
    }
    if (v.k === 'frames') {
      const C = 22, n = v.a + v.b, frames = Math.max(1, Math.ceil(n / 10)), G = 14;
      let out = '';
      for (let f = 0; f < frames; f++) {
        const ox = 2 + f * (5 * C + G), oy = 2;
        out += `<rect class="vfr" x="${ox}" y="${oy}" width="${5 * C}" height="${2 * C}" rx="3"/>`;
        for (let i = 1; i < 5; i++) out += `<line class="vfl" x1="${ox + i * C}" y1="${oy}" x2="${ox + i * C}" y2="${oy + 2 * C}"/>`;
        out += `<line class="vfl" x1="${ox}" y1="${oy + C}" x2="${ox + 5 * C}" y2="${oy + C}"/>`;
        for (let k = 0; k < 10; k++) {
          const idx = f * 10 + k; if (idx >= n) break;
          out += `<circle class="vd v${idx < v.a ? 'a' : 'b'}" cx="${ox + (k % 5) * C + C / 2}" cy="${oy + Math.floor(k / 5) * C + C / 2}" r="${C / 2 - 3}"/>`;
        }
      }
      return wrap(frames * 5 * C + (frames - 1) * G + 4, 2 * C + 4, out);
    }
    if (v.k === 'hops') {
      const S = 40, n = v.n, lo = v.dir > 0 ? v.from : v.from - n, base = 34, W = n * S + 44;
      let out = `<line class="vnl" x1="6" y1="${base}" x2="${W - 6}" y2="${base}"/>`;
      for (let i = 0; i <= n; i++) {
        const x = 22 + i * S;
        out += `<line class="vnl" x1="${x}" y1="${base - 4}" x2="${x}" y2="${base + 4}"/><text class="vnt" x="${x}" y="${base + 20}" text-anchor="middle">${lo + i}</text>`;
        if (i < n) out += `<path class="vhop" d="M${x} ${base - 6} Q${x + S / 2} ${base - 30} ${x + S} ${base - 6}"/>`;
      }
      const sx = 22 + (v.dir > 0 ? 0 : n) * S, ex = 22 + (v.dir > 0 ? n : 0) * S;
      out += `<circle class="vd va" cx="${sx}" cy="${base}" r="5"/><circle class="vd vx" cx="${ex}" cy="${base}" r="5"/>`;
      return wrap(W, base + 26, out);
    }
    if (v.k === 'bar') {
      const W = 236, H = 30, G = 4;
      const w1 = Math.max(46, Math.min(W - 46 - G, Math.round((W - G) * v.p1 / v.whole)));
      const y2 = H + 6, ty = (y) => y + H / 2 + 5;
      const out = `<rect class="vbw" x="2" y="2" width="${W}" height="${H}" rx="6"/><text class="vbt" x="${2 + W / 2}" y="${ty(2)}" text-anchor="middle">${v.whole}</text>`
        + `<rect class="vb1" x="2" y="${y2}" width="${w1}" height="${H}" rx="6"/><text class="vbt lt" x="${2 + w1 / 2}" y="${ty(y2)}" text-anchor="middle">${v.p1}</text>`
        + `<rect class="vb2" x="${2 + w1 + G}" y="${y2}" width="${W - w1 - G}" height="${H}" rx="6"/><text class="vbt" x="${2 + w1 + G + (W - w1 - G) / 2}" y="${ty(y2)}" text-anchor="middle">${v.p2}</text>`;
      return wrap(W + 4, 2 * H + 8, out);
    }
    return '';
  }
  // The one layout a strategy card has, wherever it appears (before practice,
  // or after a miss): label, the fact as the strategy reads it, picture,
  // self-talk, worked example.
  function cardInner(card) {
    return `<div class="clabel">${esc(card.label)}</div>
        <div class="cprompt">${esc(card.show)}</div>
        ${visSvg(card.vis, card.worked)}
        <div class="ctalk">${esc(card.talk)}</div>
        <div class="cworked">${esc(card.worked)}</div>`;
  }
  // Fact triangle: whole at the top, the two parts at the base, one corner hidden.
  function triSvg(it, reveal) {
    const pos = { whole: [120, 36], p1: [42, 136], p2: [198, 136] }, val = { whole: it.whole, p1: it.a, p2: it.b };
    const sym = it.op === 'add' ? '+' : '\u00D7';
    const word = (k) => (it.hide === k && !reveal) ? 'a missing number' : val[k];
    const label = `Fact triangle: ${word('whole')} at the top, ${word('p1')} and ${word('p2')} below, joined by ${sym === '+' ? 'adding' : 'multiplying'}`;
    let out = `<polygon class="trie" points="120,36 42,136 198,136"/><text class="triop" x="120" y="112" text-anchor="middle">${it.op === 'add' ? '+ \u2212' : '\u00D7 \u00F7'}</text>`;
    for (const k of ['whole', 'p1', 'p2']) {
      const hid = it.hide === k, x = pos[k][0], y = pos[k][1];
      out += `<circle class="trik${hid ? (reveal ? ' done' : ' hid') : ''}" cx="${x}" cy="${y}" r="25"/><text class="trin" x="${x}" y="${y + 8}" text-anchor="middle">${hid && !reveal ? '?' : val[k]}</text>`;
    }
    return `<svg class="tri" viewBox="0 0 240 166" width="240" height="166" role="img" aria-label="${esc(label)}">${out}</svg>`;
  }

  function describeFocus(p) {
    const acq = Content.allFactIds().filter(id => p.facts[id].state === 'acquiring');
    if (!acq.length) return null;
    let id = acq[0], t = -1; for (const x of acq) if (p.facts[x].lastSeen > t) { t = p.facts[x].lastSeen; id = x; }
    const { op, a, b } = Content.parse(id);
    if (op === 'mul') return '\u00D7' + Content.leadFactor(a, b) + ' facts';
    if (op === 'div') return 'division facts';
    if (op === 'sub') return 'take-away facts';
    if (op === 'add') { const r = Content.addPhaseRank(a, b); return r === 1 ? 'doubles' : r === 2 ? 'pairs that make ten' : r === 3 ? 'make-ten facts' : r === 4 ? 'near-doubles' : 'adding facts'; }
    return null;
  }

  /* ---- root render dispatch -------------------------------------------- */
  function render() {
    const app = $('app'); if (!app) return;
    const screens = { firstRun: renderFirstRun, name2: renderPlacementChoice, placement: renderPlay, home: renderHome, session: renderSession, post: renderPost, browse: renderBrowse, grownups: renderGrownups, skill: renderSkill, sky: renderSky, bonus: renderBonus };
    app.innerHTML = (screens[state.screen] || renderHome)();
    if (window.scrollTo) window.scrollTo(0, 0);
    wireCarousel();   // re-attach the swipe->tab sync whenever the carousel is on screen
  }
  function setActiveTab(i) {
    const tabs = document.querySelectorAll ? document.querySelectorAll('.gtabs .gtab') : null;
    if (!tabs) return;
    for (let k = 0; k < tabs.length; k++) {
      if (tabs[k].classList) tabs[k].classList.toggle('active', k === i);
      if (tabs[k].setAttribute) tabs[k].setAttribute('aria-pressed', k === i ? 'true' : 'false');
    }
  }
  function wireCarousel() {
    const car = $('gcar'); if (!car || car._wired) return; car._wired = true;
    let ticking = false;
    car.addEventListener('scroll', () => {
      if (ticking) return; ticking = true;
      const settle = () => {
        ticking = false;
        const kids = car.children; if (!kids || !kids.length) return;
        const base = kids[0].offsetLeft || 0;   // page-relative -> carousel-relative (see gridTab)
        let best = 0, bd = Infinity;
        for (let k = 0; k < kids.length; k++) { const d = Math.abs(((kids[k].offsetLeft || 0) - base) - car.scrollLeft); if (d < bd) { bd = d; best = k; } }
        setActiveTab(best);   // swiping the grids updates which tab reads active
      };
      if (window.requestAnimationFrame) window.requestAnimationFrame(settle); else setTimeout(settle, 80);
    });
  }

  /* ---- first run: name (skippable) + placement choice ------------------ */

  /* ---- reduced placement (Option B) ------------------------------------ */
  // The first `placementWarmupItems` are an on-ramp (placement spec §2):
  // presented like any other item but DISCARDED from seeding, so the timing
  // of the real probes isn't polluted by find-the-keypad latency — which
  // otherwise lands on the first doubles and can silently cost the basal
  // credit. Warm-up items are easy count-on facts outside the probe set.
  const PLACEMENT_WARMUP_POOL = ['add_1_3', 'add_2_4', 'add_1_4'];
  function beginPlacement() {
    const n = state.profile.settings.placementWarmupItems || 0;
    const warm = PLACEMENT_WARMUP_POOL.slice(0, n).map(id => Object.assign({ id, discard: true }, Content.factQuestion(id, Rng)));
    const items = warm.concat(Engine.placementPhaseAIds().map(id => Object.assign({ id }, Content.factQuestion(id, Rng))));
    state.placement = { items, idx: 0, results: [], phaseB: false };
    loadPlacementQ();
  }
  function loadPlacementQ() {
    const pl = state.placement, it = pl.items[pl.idx];
    state.aq = { kind: 'placement', id: it.id, prompt: it.prompt, answer: it.answer, discard: !!it.discard, input: '', shownAt: Date.now(), locked: false, feedback: null };
    state.screen = 'placement'; render();
  }

  /* ---- "see your progress" — pull, not push (dashboard §2.7) ------------ */
  // The richer view sits behind a tap and is hidden until there are two data
  // points (§2.9: no empty chart). It is the collection count over sessions —
  // upward-only by construction, since the display never shrinks (§3) — with
  // no axis numbers, no benchmark, no comparison. Beneath it, one soft
  // self-referential goal: the next round-number stop (goal-setting + progress
  // feedback line: Codding 2005/2009; Figarola 2008; Duhon 2015). Speed stays
  // prose-only exactly as before; no milliseconds appear anywhere here.
  function progressSparkline(p) {
    const pts = realSessions(p).map(s => s.known).filter(k => k != null);
    if (pts.length < 2) return '';
    if (!state.showProgress) return `<button class="link plink" data-action="toggleProgress">See your progress</button>`;
    const recent = pts.slice(-10);
    const min = Math.min.apply(null, recent), span = Math.max(1, Math.max.apply(null, recent) - min);
    const W = 260, H = 48, pad = 6;
    const xy = recent.map((v, i) => [
      Math.round(pad + i * (W - 2 * pad) / (recent.length - 1)),
      Math.round(H - pad - (v - min) * (H - 2 * pad) / span)
    ]);
    const end = xy[xy.length - 1];
    const svg = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Facts you know, session by session"><polyline points="${xy.map(q => q.join(',')).join(' ')}" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${end[0]}" cy="${end[1]}" r="4" fill="var(--gold-fill)" stroke="var(--gold-edge)" stroke-width="1"/></svg>`;
    const total = Engine.collectionCounts(p).total, step = total < 50 ? 10 : 25;
    const goal = Math.min((Math.floor(total / step) + 1) * step, Content.allFactIds().length);
    const goalLine = goal > total ? `<div class="sparkgoal">Next stop: <b>${goal}</b> \u2014 ${goal - total} to go</div>` : '';
    return `<div class="sparkwrap">${svg}${goalLine}<button class="link plink" data-action="toggleProgress">Hide</button></div>`;
  }

  /* ---- win sounds (juice pass) ------------------------------------------ */
  // Tiny synthesised tones, no assets, no network. Sounds mark WINS ONLY —
  // there is deliberately no error sound: errors are the learning signal
  // (strategy cards, think-aloud), and punishing them with a buzzer is the
  // Duolingo mechanic this cohort must not inherit. Every call is guarded and
  // no-ops headlessly (node / smoke have no AudioContext). The AudioContext
  // is created lazily on first use, which in practice is always after a tap,
  // satisfying iOS autoplay rules.
  let _actx = null;
  function sfx(kind) {
    try {
      const p = state.profile;
      if (!p || p.settings.soundOn === false) return;
      const AC = (typeof AudioContext !== 'undefined') ? AudioContext
        : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
      if (!AC) return;
      if (!_actx) _actx = new AC();
      if (_actx.state === 'suspended') _actx.resume();
      const t0 = _actx.currentTime;
      const tone = (freq, at, dur, type, gain) => {
        const o = _actx.createOscillator(), g = _actx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(gain, t0 + at + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        o.connect(g); g.connect(_actx.destination);
        o.start(t0 + at); o.stop(t0 + at + dur + 0.02);
      };
      if (kind === 'ok') { tone(660, 0, 0.09, 'sine', 0.10); tone(880, 0.07, 0.11, 'sine', 0.10); }
      else if (kind === 'gold') { [523, 659, 784].forEach((f, i) => tone(f, i * 0.09, 0.14, 'triangle', 0.13)); }
      else if (kind === 'fanfare') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.17, 'triangle', 0.13)); }
    } catch (e) { /* sound is decoration; never let it break practice */ }
  }

  /* ---- the sky: constellation skin (sky spec, mid-pilot drop) ----------- */
  // RELEASED (Sam's call, Aug 2026: no pilot hold — general use from day one,
  // so the mid-pilot freshness-drop timing in sky spec §7 no longer applies).
  // ?sky=1 remains a harmless preview alias.
  const SKY_FLAG = true;
  const skyOn = () => SKY_FLAG || (typeof location !== 'undefined' && /[?&]sky=1\b/.test(location.search));

  // 11 fixed 11-point patterns (0..100 x 0..70), each a walkable path so the
  // completion polyline connects stars in fact order (n op 0 .. n op 10).
  // The addition band mirrors them (x -> 100-x) for 22 distinct shapes from
  // half the data. Purely decorative by decision (sky spec §8.1).
  const SKY_PATTERNS = [
    [[6,50],[15,40],[24,32],[34,26],[44,22],[54,20],[64,22],[74,26],[84,32],[91,40],[95,50]],
    [[8,12],[20,34],[30,16],[40,38],[50,18],[60,40],[70,20],[80,42],[88,24],[93,46],[95,62]],
    [[6,18],[16,34],[26,50],[36,34],[46,18],[56,34],[66,50],[76,34],[86,18],[92,30],[95,44]],
    [[8,55],[8,30],[20,45],[30,15],[42,45],[50,10],[58,45],[70,15],[80,45],[92,30],[92,55]],
    [[10,15],[22,18],[34,22],[46,28],[54,38],[58,50],[70,54],[82,52],[90,44],[86,32],[74,30]],
    [[12,12],[26,10],[40,14],[50,22],[54,32],[50,42],[40,50],[34,58],[44,64],[60,64],[76,60]],
    [[6,60],[16,48],[26,36],[36,24],[46,12],[52,8],[58,14],[68,26],[78,38],[88,50],[94,60]],
    [[50,8],[64,20],[72,34],[64,48],[50,58],[36,48],[28,34],[36,20],[50,26],[50,40],[50,62]],
    [[50,34],[62,30],[68,40],[62,52],[48,56],[34,50],[28,36],[34,22],[50,14],[68,14],[84,22]],
    [[8,60],[12,44],[20,32],[32,24],[46,20],[60,22],[72,28],[82,38],[90,50],[93,62],[50,62]],
    [[4,36],[13,26],[22,36],[31,26],[40,36],[49,26],[58,36],[67,26],[76,36],[85,26],[94,36]]
  ];
  // Sky star: same tier language as everywhere else, EXCEPT `new` renders as
  // a faint outline star, never a lock — "still to come", not "locked out"
  // (sky spec §4: no deficit framing on this screen).
  function skyGlyph(f, size) {
    if (f.state === 'new' && !f.everFluent) return `<span class="stnew">${starSvg(0, false, size)}</span>`;
    return glyphFor(f, size);
  }
  function skyTile(p, op, n) {
    const idOf = op === 'mul' ? Content.mulId : Content.addId;
    const pts = SKY_PATTERNS[n].map(([x, y]) => (op === 'add' ? [100 - x, y] : [x, y]));

      : '';
    const stars = pts.map(([x, y], k) => `<span class="st" style="left:${x}%;top:${y / 70 * 100}%">${skyGlyph(p.facts[idOf(n, k)], 14)}</span>`).join('');
    return `<button class="const" data-action="chooseTable" data-op="${op}" data-n="${n}" aria-label="${name} \u2014 ${gold} of 11 off by heart">

  function renderSky() {

      ${band('mul', 'Times tables')}
      ${band('add', 'Addition')}
      <p class="skylegend">Every fact you learn is a star \u2014 half stars ${starSvg(0.5, false, 14)} you can do, gold stars ${starSvg(1, false, 14)} you know off by heart. Learn a whole row and its stars join up into a constellation.</p>
    </div>`;
  }

  /* ---- home dashboard --------------------------------------------------- */
  function renderHome() {
    const p = state.profile, c = Engine.collectionCounts(p), first = realSessions(p).length === 0;
    const name = p.name && p.name.trim();
    const greeting = name ? 'Hi ' + esc(name) + ' \uD83D\uDC4B' : 'Hi \uD83D\uDC4B';
    const prog = Math.round(Engine.domainProgress(p) * 100);
    const focus = describeFocus(p);
    const trend = Engine.trendNote(p);
    const pair = Engine.featuredFamilyPair(p);

    const tiers = `
      <div class="tier">${starSvg(1, false, 20)}<b>${c.gold}</b><span>know off by heart</span></div>

    const collection = `<div class="card collection">
      <div class="ctitle">\uD83C\uDFC6 Facts you know</div>
      <div class="count-big">${c.total}</div>

      ? `<p class="lede">${c.total > 0
