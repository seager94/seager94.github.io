        : "As you practise, your stars fill in \u2014 half stars for facts you can do, gold stars for facts you know off by heart."}</p>`
      : '';
    const cta = `<button class="cta big" data-action="startSession">\u25B6 Start today<small>~10 min${focus ? ' \u00B7 ' + esc(focus) : ''}</small></button>`;
    // choice-grid on-ramp: surface the next open table so times tables are a
    // visible destination during the add_sub era, not something to stumble on
    const sug = Engine.suggestedTable(p);
    const suggest = sug != null ? `<button class="link suggest" data-action="gotoSuggested" data-n="${sug}">Times tables are open \u2014 try \u00D7${sug} \u2192</button>` : '';
    const gridsCard = `<div class="card">
      <div class="gtabs">
        <button class="gtab active" aria-pressed="true" data-action="gridTab" data-i="0">Times tables</button>
        <button class="gtab" aria-pressed="false" data-action="gridTab" data-i="1">Addition</button>
      </div>
      <div class="gcar" id="gcar">
        <div class="gslide">${renderGrid(p, 'mul')}<p class="mapnote tapnote">Tap a row number to practise that table.</p></div>
        <div class="gslide">${renderGrid(p, 'add')}<p class="mapnote tapnote">Tap a row number to practise adding that number.</p></div>
      </div>
      ${gridLegend()}
    </div>`;
    const summary = `<div class="card"><div class="ctitle small">All your facts</div>${renderOpSummary(p)}</div>`;
    const chain = pair ? `<div class="card chain-card"><div class="ctitle small">Today's family \u2014 ${pair[0]} &amp; ${pair[1]}</div>${renderChain(pair)}</div>` : '';
    const streak = !first ? `<div class="row streak"><span>\uD83D\uDD25 ${p.streak.current}-day streak</span><span class="muted">best ${p.streak.longest}</span></div>` : '';
    const trendLine = trend === 'quicker' ? `<div class="row trend">\uD83D\uDCC8 You're getting quicker \u2014 that's facts becoming automatic.</div>` : '';
    const links = `<div class="links">
      ${skyOn() ? '<button class="link" data-action="gotoSky">See your sky</button>' : ''}
      <button class="link" data-action="gotoBrowse">See all my facts</button>
      <button class="link" data-action="gotoGrownups">For grown-ups</button>
    </div>`;

    const saveWarn = state.saveFailed ? `<div class="hint savewarn" role="status">This browser isn't saving your progress (private mode, or the phone is out of space). Open Eager4Maths in a normal tab to keep your stars.</div>` : '';
    return `<div class="screen">
      <div class="brand">Eager4Maths</div>
      <div class="greet">${greeting}</div>
      ${saveWarn}${collection}${intro}${cta}${suggest}${gridsCard}${summary}${chain}${streak}${trendLine}${links}
    </div>`;
  }

  function renderChain(pair) {
    const ids = Content.familyMembers(pair[0], pair[1]);
    const nodes = ids.map(id => {
      const f = state.profile.facts[id];
      return `<div class="node"><div class="nq">${esc(Content.factQuestion(id).prompt)}</div>${glyphFor(f, 26)}</div>`;
    }).join('<span class="arrow">\u2192</span>');
    return `<div class="chain">${nodes}</div>`;
  }

  function tierClass(f) {
    if (f.state === 'automatic') return 'auto';
    if (f.state === 'fluent') return f.everAutomatic ? 'refresh' : 'flu';
    if (f.everFluent) return 'refresh';
    if (f.state === 'acquiring') return 'acq';
    return 'new';
  }
  function renderGrid(p, op) {
    const idOf = op === 'mul' ? Content.mulId : Content.addId;
    const sym = op === 'mul' ? '\u00D7' : '+';
    const lab = (n) => `<div class="gc glabel tap" data-action="chooseTable" data-op="${op}" data-n="${n}">${n}</div>`;
    let cells = `<div class="gc gcorner">${sym}</div>`;
    for (let c = 0; c <= 10; c++) cells += lab(c);
    for (let r = 0; r <= 10; r++) {
      cells += lab(r);
      for (let c = 0; c <= 10; c++) { const f = p.facts[idOf(r, c)]; cells += `<div class="gc ${tierClass(f)}" title="${r}${sym}${c}"></div>`; }
    }
    return `<div class="mgrid" role="img" aria-label="${op === 'mul' ? 'Multiplication' : 'Addition'} progress grid; fact counts are in the summary below">${cells}</div>`;
  }
  function gridLegend() {
    return `<div class="gridleg">
      <span><i class="sw new"></i>not started</span>
      <span><i class="sw acq"></i>working</span>
      <span><i class="sw flu"></i>can do</span>
      <span><i class="sw auto"></i>off by heart</span>
    </div>`;
  }
  function renderOpSummary(p) {
    const o = Engine.opSummary(p);
    const row = (label, key) => { const k = o[key][0], t = o[key][1], pct = t ? Math.round(k / t * 100) : 0; return `<div class="opr"><span class="opl">${label}</span><span class="opbar"><span style="width:${pct}%"></span></span><span class="opn">${k}/${t}</span></div>`; };
    return `<div class="opsum">${row('Addition', 'add')}${row('Subtraction', 'sub')}${row('Multiplication', 'mul')}${row('Division', 'div')}</div>`;
  }

  /* ---- the session: warm-up -> strategy card -> timed practice --------- */
  function beginSession(focusIds) {
    const p = state.profile;
    const focused = Array.isArray(focusIds) && focusIds.length > 0;
    const plan = focused ? Engine.buildFocusedSession(p, focusIds) : Engine.buildSession(p);
    let known;
    if (focused) {
      const fop = Content.parse(plan.focus[0] || focusIds[0]).op;
      known = Content.allFactIds().filter(id => Engine.isFluentOrAbove(p.facts[id]) && Content.parse(id).op === fop);
    } else {
      const dom = p.settings.currentDomain;
      known = Content.allFactIds().filter(id => Engine.isFluentOrAbove(p.facts[id]) && Content.domainOf(id) === dom);
    }
    const warmup = shuffleArr(known).slice(0, 3).map(id => Object.assign({ id }, Content.factQuestion(id, Rng)));
    // Strategy card only for a fact being LEARNED (new/acquiring). Cards are
    // retired once retrieval is the job — showing one for a fluent/automatic
    // fact (possible in chosen-table sessions) would invite continued
    // deriving, the exact pattern the retire-at-automatic scoping exists to
    // stop (strategy spec §1).
    const learnable = plan.focus.filter(id => { const st = p.facts[id].state; return st === 'new' || st === 'acquiring'; });
    const primary = plan.introduced || (learnable.length ? learnable[learnable.length - 1] : null);
    const card = primary ? Content.cardContent(primary) : null;
    state.session = {
      id: 'sess_' + Date.now(), plan, phase: null, focused: focused,
      warmup, wIdx: 0, card, primary,
      practice: plan.trials.slice(), pIdx: 0,
      errors: {}, retired: new Set(), focusSet: new Set(plan.focus),
      metacogShown: 0, metacog: [],
      attempted: 0, correct: 0, msSum: 0, msN: 0, newlyAutomatic: [],
      collectionBefore: Engine.collectionCounts(p), streakBefore: p.streak.current
    };
    state.screen = 'session';
    if (warmup.length) startPhase('warmup');
    else if (card) startPhase('card');
    else startPhase('practice');
  }
  function startPhase(phase) {
    const s = state.session; s.phase = phase;
    if (phase === 'warmup') loadWarmupQ();
    else if (phase === 'card') render();
    else loadPracticeQ();
  }
  function loadWarmupQ() {
    const s = state.session, it = s.warmup[s.wIdx];
    state.aq = { kind: 'warmup', id: it.id, prompt: it.prompt, answer: it.answer, input: '', shownAt: Date.now(), locked: false, feedback: null };
    render();
  }
  function loadPracticeQ() {
    const s = state.session;
    while (s.pIdx < s.practice.length) {
      const id = s.practice[s.pIdx];
      if (s.focusSet.has(id) && s.retired.has(id)) { s.pIdx++; continue; }
      const q = Content.factQuestion(id, Rng);
      state.aq = { kind: 'practice', id, prompt: q.prompt, answer: q.answer, input: '', shownAt: Date.now(), locked: false, feedback: null };
      render(); return;
    }
    endSession();
  }
  function renderSession() {
    const s = state.session, aq = state.aq;
    if (s.phase === 'card') return renderCard();
    const fx = aq && aq.fix;
    if (fx && fx.stage === 'show') return renderFix();
    const retry = fx ? 'Your turn \u2014 type the answer.' : null;
    const barAt = s.practice.length ? Math.min(s.pIdx, s.practice.length) / s.practice.length : 0;
    if (s.phase === 'warmup') return renderPlay({ label: '\uD83C\uDF31 Warm-up', prog: (s.wIdx + 1) + ' of ' + s.warmup.length, hint: retry || 'Easy ones to start.', stop: 'session', bar: 0 });
    return renderPlay({ label: 'Practice', prog: Math.min(s.pIdx + 1, s.practice.length) + ' of ' + s.practice.length, hint: retry, stop: 'session', bar: barAt, showMe: !fx });
  }
  function renderCard() {
    const s = state.session;
    return `<div class="screen">
      <div class="beat">A way to think about it</div>
      <div class="card cardface">
        ${cardInner(s.card)}
      </div>
      <button class="cta" data-action="gotCard">Got it</button>
    </div>`;
  }
  // The correction screen: same card, shown because this fact was just missed
  // (or the student asked). The keypad is deliberately absent — the model is
  // read, then covered, and the retry happens on the plain question screen.
  function renderFix() {
    const fx = state.aq.fix;
    const note = fx.why === 'show' ? "Here's a way to get it." : (fx.looks > 1 ? 'One more look.' : "Not quite \u2014 here's a way to get it.");
    return `<div class="screen">
      <div class="fixnote${fx.why === 'show' ? ' plain' : ''}" role="status" aria-live="polite">${note}</div>
      <div class="card cardface">
        ${cardInner(fx.card)}
      </div>
      <button class="cta" data-action="fixGot">Got it \u2014 my turn</button>
    </div>`;
  }

  /* ---- shared question screen (warm-up / practice / placement) --------- */
  function renderPlay(opts) {
    opts = opts || (state.screen === 'placement'
      ? { label: 'Quick check', prog: (state.placement.idx + 1) + ' of ' + state.placement.items.length, hint: "Answer what you can \u2014 guessing or skipping is fine.", skip: true, stop: 'placement' }
      : {});
    const aq = state.aq, fb = aq.feedback;
    let body;
    if (fb && fb.metacog) {
      body = `<div class="metacog">
        <div class="mq">How did you get it?</div>
        <button class="mbtn" data-action="metacog" data-m="counted">I counted</button>
        <button class="mbtn" data-action="metacog" data-m="usedfact">I used a fact I knew</button>
        <button class="mbtn" data-action="metacog" data-m="knew">I just knew it</button>
      </div>`;
    } else if (fb) {
      body = fb.correct
        ? (fb.gold
          ? `<div class="fb ok" role="status" aria-live="polite"><span class="goldpop">${starSvg(1, false, 24)}</span> ${esc(aq.prompt)} \u2014 off by heart!</div>`
          : `<div class="fb ok" role="status" aria-live="polite">\u2713 Yes!</div>`)
        : `<div class="fb soft" role="status" aria-live="polite">Not quite \u2014 ${esc(aq.prompt)} = <b>${fb.answer}</b></div>`;
    } else {
      body = keypad();
    }
    const ansClass = fb ? (fb.correct ? 'ok' : fb.metacog ? '' : 'soft') : '';
    const snd = state.profile && state.profile.settings.soundOn !== false;
    return `<div class="screen play">
      <div class="beat">${esc(opts.label || '')}${opts.prog ? ` <span class="prog">${esc(opts.prog)}</span>` : ''}${opts.stop === 'session' ? `<button class="sndbtn" data-action="toggleSound" aria-label="${snd ? 'Sound on' : 'Sound off'}">${snd ? '\uD83D\uDD0A' : '\uD83D\uDD07'}</button>` : ''}</div>
      ${opts.bar != null ? `<div class="pbar" aria-hidden="true"><i style="width:${Math.round(opts.bar * 100)}%"></i></div>` : ''}
      <div class="qcard">
        <div class="prompt">${esc(aq.prompt)}</div><div class="eq">=</div>
        <div class="answer ${ansClass}" id="answer">${esc(aq.input) || '<span class="cursor">_</span>'}</div>
      </div>
      ${body}
      ${opts.hint && !fb ? `<div class="hint">${esc(opts.hint)}</div>` : ''}
      ${opts.skip && !fb ? `<button class="link skip" data-action="placementSkipOne">I don't know this one</button>` : ''}
      ${opts.showMe && !fb ? `<button class="link showme" data-action="showMe">Show me how</button>` : ''}
      ${opts.stop && !fb ? (opts.stop === 'placement'
        ? `<button class="link skip" data-action="placementStop">Stop here \u2014 keep what we've done</button>`
        : `<button class="link skip" data-action="sessionStop">Stop here for today</button>`) : ''}
    </div>`;
  }
  function keypad() {
    const k = (d) => `<button class="key" data-action="digit" data-d="${d}">${d}</button>`;
    return `<div class="keypad">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}
      <button class="key sub" data-action="back" aria-label="delete">\u232B</button>
      ${k(0)}
      <button class="key go" data-action="enter" aria-label="enter">\u2713</button>
    </div>`;
  }

  /* ---- answer evaluation ----------------------------------------------- */
  // HONEST TIMING. A session answer that sat through an interruption is not a
  // response time: the page was hidden (phone locked, app switched) or it ran
  // past AWAY_MS. Kept as a number it read as "slow" — knocking an automatic
  // fact back to fluent and inflating the session mean that the "getting
  // quicker" trend is built on. null means "answered, untimed": the engine
  // neither demotes for slowness nor credits speed (Debug T41). `k` is the
  // time to the first keystroke, logged for pilot calibration only.
  const AWAY_MS = 60000;   // judgment: past a minute, nobody is retrieving or deriving a basic fact
  function timing(aq) {
    const raw = Date.now() - aq.shownAt;
    if (aq.away || raw > AWAY_MS) return { ms: null, k: null };
    return { ms: raw, k: aq.firstAt != null ? Math.max(0, aq.firstAt - aq.shownAt) : null };
  }
  function advancer(aq) { return aq.kind === 'warmup' ? advanceWarmup : advancePractice; }
  // One real attempt on the current session question: state machine, tallies,
  // 3-error retire, the running session stub, and the per-answer save.
  function recordAttempt(correct, ms, k, via) {
    const aq = state.aq, p = state.profile, s = state.session;
    const before = p.facts[aq.id].state;
    const att = { correct, ms, sessionId: s.id, ts: Clock.now(), warmup: aq.kind === 'warmup' };
    if (k != null) att.k = k;
    if (via) att.via = via;
    Engine.applyAttempt(p, aq.id, att);
    s.attempted++; if (correct) s.correct++;
    if (ms != null) { s.msSum += ms; s.msN++; }
    // The gold moment: the exact answer that tips a fact to automatic gets a
    // brief in-place acknowledgment (Hattie task-level feedback, delivered at
    // the moment rather than deferred to the post screen).
    const wentGold = p.facts[aq.id].state === 'automatic' && before !== 'automatic';
    if (wentGold) s.newlyAutomatic.push(aq.id);
    if (correct) sfx(wentGold ? 'gold' : 'ok');   // wins only: placement, misses and Show-me stay silent
    if (aq.kind === 'practice' && s.focusSet.has(aq.id) && !correct) { s.errors[aq.id] = (s.errors[aq.id] || 0) + 1; if (s.errors[aq.id] >= 3) s.retired.add(aq.id); }
    stashOpen();
    save();  // persist per attempt: an interrupted session never loses fact progress
    return wentGold;
  }
  function commitAnswer() {
    const aq = state.aq; if (!aq || aq.locked || aq.input === '') return;
    const correct = parseInt(aq.input, 10) === aq.answer;
    if (aq.kind === 'tri') { commitTri(correct); return; }
    if (aq.fix) { commitRetry(correct); return; }
    aq.locked = true;
    if (aq.kind === 'placement') {
      // Placement keeps the raw time: an interrupted correct probe then seeds
      // `acquiring` (the conservative reading), never an unearned `fluent`.
      const ms = Date.now() - aq.shownAt;
      const k = aq.firstAt != null && !aq.away ? Math.max(0, aq.firstAt - aq.shownAt) : null;
      if (!aq.discard) state.placement.results.push({ factId: aq.id, correct, ms, k });
      aq.feedback = { correct, answer: aq.answer }; render();
      setTimeout(advancePlacement, correct ? 520 : 1100); return;
    }
    const t = timing(aq), s = state.session;
    const wentGold = recordAttempt(correct, t.ms, t.k, null);
    if (!correct) { beginFix('miss'); return; }
    // The gold moment takes priority over the metacog prompt for this one
    // item — the metacog quota stays available for later items.
    const wantMeta = !wentGold && aq.kind === 'practice' && s.focusSet.has(aq.id) && s.metacogShown < 2 && Rng() < 0.5;
    if (wantMeta) { s.metacogShown++; aq.feedback = { metacog: true }; render(); return; }
    aq.feedback = { correct, answer: aq.answer, gold: wentGold }; render();
    setTimeout(advancer(aq), wentGold ? 1500 : 520);
  }

  /* ---- correction: show the strategy, cover it, try again --------------- */
  // A miss used to flash the answer for about a second and move on. Now the
  // fact's own strategy card is shown (picture + self-talk + worked example),
  // then covered, and the student answers the fact themselves — cover, copy,
  // compare, with the model removed before the retry so the second go is a
  // short-delay retrieval rather than a copy. Only the FIRST answer is
  // evidence: the retry never reaches the state machine or the attempt log.
  // "Show me how" enters the same loop without a guess; it is recorded as a
  // miss with no timing (a prompted answer is not a known fact) and tagged
  // v:1 in the attempt log so pilot analysis can tell it from a wrong answer.
  function beginFix(why) {
    const aq = state.aq, card = Content.cardContent(aq.id);
    if (!card) { aq.feedback = { correct: false, answer: aq.answer }; render(); setTimeout(advancer(aq), 1100); return; }
    aq.fix = { why, card, stage: 'show', looks: 1 };
    aq.locked = true; aq.feedback = null; aq.input = '';
    render();
  }
  function commitRetry(correct) {
    const aq = state.aq, fx = aq.fix;
    aq.locked = true;
    if (correct) { sfx('ok'); aq.feedback = { correct: true, answer: aq.answer }; render(); setTimeout(advancer(aq), 520); return; }
    if (fx.looks < 2) { fx.looks++; fx.stage = 'show'; aq.input = ''; render(); return; }   // one more look, then move on
    aq.feedback = { correct: false, answer: aq.answer }; render(); setTimeout(advancer(aq), 1400);
  }

  /* ---- beat 4: fact triangles (untimed; writes no fact state) ----------- */
  // The spec's "light game beat" (engine §5) without a clock — time is never
  // a target (dashboard §2.7). Three numbers, one family; one corner hidden.
  // Drawn only from families whose base fact the student already KNOWS
  // (Engine.familyTriples), so it is think-addition / think-multiplication
  // practice on secure ground — the on-ramp to the take-away and division
  // facts that inherit from them — and a high-success finish, not a second
  // test. Answers never touch the state machine or the attempt log; only a
  // [right, asked] tally lands on the session record, so the pilot can see
  // whether the beat is used. Skippable, and skipped outright when the
  // student stopped the session early.
  const TRI_COUNT = 4;
  function buildBonus() {
    const s = state.session;
    const seen = [...new Set(s.practice.concat(s.warmup.map(w => w.id)))];
    const triples = shuffleArr(Engine.familyTriples(state.profile, seen)).slice(0, TRI_COUNT);
    if (triples.length < 3) return null;
    const corners = ['p1', 'p2', 'whole'];
    return { items: triples.map(t => Object.assign({ hide: corners[Math.floor(Rng() * 3)] }, t)), idx: 0, right: 0, asked: 0 };
  }
  function loadTri() {
    const b = state.bonus, it = b.items[b.idx];
    state.aq = { kind: 'tri', answer: it.hide === 'whole' ? it.whole : it.hide === 'p1' ? it.a : it.b, input: '', locked: false, feedback: null };
    state.screen = 'bonus'; render();
  }
  function commitTri(correct) {
    const aq = state.aq, b = state.bonus;
    aq.locked = true; b.asked++; if (correct) { b.right++; sfx('ok'); }
    aq.feedback = { correct, answer: aq.answer }; render();
  }
  function finishBonus() {
    const p = state.profile, b = state.bonus, s = state.session;
    if (b && b.asked > 0 && s) {
      const rec = p.sessions[p.sessions.length - 1];
      if (rec && rec.id === s.id) { rec.tri = [b.right, b.asked]; save(); }
    }
    state.bonus = null; state.aq = null; gotoPost();
  }
  // Arriving at the post screen. The whole-row / summit fanfare is held for
  // this moment, so it sounds with the card it celebrates and not at the
  // start of the triangle round that now sits between practice and post.
  function gotoPost() {
    const s = state.session;
    if (s && s.fanfare) { s.fanfare = false; sfx('fanfare'); }
    state.screen = 'post'; render();
  }
  function renderBonus() {
    const b = state.bonus, it = b.items[b.idx], aq = state.aq, fb = aq.feedback;
    const sym = it.op === 'add' ? '+' : '\u00D7', inv = it.op === 'add' ? '\u2212' : '\u00F7';
    const box = `<span class="answer${fb ? (fb.correct ? ' ok' : ' soft') : ''}" id="answer">${fb ? aq.answer : (esc(aq.input) || '<span class="cursor">_</span>')}</span>`;
    const cell = (k, v) => it.hide === k ? box : `<span>${v}</span>`;
    const word = (k, v) => it.hide === k ? 'blank' : v;
    const eq = `<div class="triq" aria-label="${word('p1', it.a)} ${sym} ${word('p2', it.b)} = ${word('whole', it.whole)}">${cell('p1', it.a)}<span>${sym}</span>${cell('p2', it.b)}<span>=</span>${cell('whole', it.whole)}</div>`;
    let body;
    if (fb) {
      const fam = [`${it.a} ${sym} ${it.b} = ${it.whole}`];
      if (it.a !== it.b) fam.push(`${it.b} ${sym} ${it.a} = ${it.whole}`);
      fam.push(`${it.whole} ${inv} ${it.a} = ${it.b}`);
      if (it.a !== it.b) fam.push(`${it.whole} ${inv} ${it.b} = ${it.a}`);
      body = `<div class="fb tight ${fb.correct ? 'ok' : 'soft'}" role="status" aria-live="polite">${fb.correct ? '\u2713 Yes!' : "It's " + aq.answer}</div>
        <div class="mq">One triangle, ${fam.length === 4 ? 'four' : 'two'} facts</div>
        <div class="trifam">${fam.map(f => `<span>${f}</span>`).join('')}</div>
        <button class="cta" data-action="triNext">${b.idx + 1 < b.items.length ? 'Next' : 'See how I went'}</button>`;
    } else {
      body = `${b.idx === 0 ? `<div class="mq">Three numbers, one family. What's missing?</div>` : ''}${keypad()}
        <button class="link skip" data-action="triSkip">Skip to the end</button>`;
    }
    return `<div class="screen play">
      <div class="beat">Fact triangles <span class="prog">${b.idx + 1} of ${b.items.length}</span></div>
      <div class="qcard tricard">${triSvg(it, !!fb)}</div>
      ${eq}
      ${body}
    </div>`;
  }
  function advancePlacement() {
    const pl = state.placement; if (!pl) return;   // timer outlived the flow: drop it
    pl.idx++;
    if (pl.idx >= pl.items.length) {
      // Phase B (placement spec §3): only an add-strong Phase A opens the mul
      // sample; everyone else finishes here and never faces it.
      if (!pl.phaseB && Engine.phaseBFromProbes(pl.results, state.profile.settings)) {
        pl.phaseB = true;
        pl.items = pl.items.concat(Engine.placementPhaseBIds().map(id => Object.assign({ id }, Content.factQuestion(id, Rng))));
        loadPlacementQ(); return;
      }
      Engine.seedFromProbeResults(state.profile, pl.results); // seeds + sets placementResolved + maybeAdvanceDomain
      state.placement = null; state.aq = null;                // drop transient probe state
      save(); state.screen = 'home'; render(); return;
    }
    loadPlacementQ();
  }
  function advanceWarmup() {
    const s = state.session; if (!s) return;
    s.wIdx++;
    if (s.wIdx >= s.warmup.length) { startPhase(s.card ? 'card' : 'practice'); return; }
    loadWarmupQ();
  }
  function advancePractice() { const s = state.session; if (!s) return; s.pIdx++; loadPracticeQ(); }
  // UNFINISHED-SESSION RECOVERY. Fact progress was always saved per answer,
  // but the session record and the streak day only landed in endSession — so
  // a student who answered 20 of 24 and then locked the phone lost the
  // session from their history and the day from their streak. The running
  // tally is now stashed on the profile with every answer (stashOpen) and
  // closed out either here or on the next open (recoverOpen), dated to the
  // day it was actually played.
  function tally() {
    const p = state.profile, s = state.session;
    return {
      id: s.id, date: Engine.isoDay(Clock.now()), domain: p.settings.currentDomain,
      attempted: s.attempted, correct: s.correct, msSum: s.msSum, msN: s.msN,
      newlyAutomatic: s.newlyAutomatic.slice(), metacog: s.metacog.slice(),
      introduced: s.plan.introduced || null
    };
  }
  function stashOpen() { state.profile.openSession = tally(); }
  function closeOut(p, o) {
    if (o.introduced) p.lastIntroducedId = o.introduced;
    p.sessions.push({
      id: o.id, date: o.date, domain: o.domain,
      attempted: o.attempted, correct: o.correct,
      meanMs: o.msN ? Math.round(o.msSum / o.msN) : 0,
      known: Engine.collectionCounts(p).total,   // feeds the §2.7 progress line; absent on pre-update records (line just starts later)
      newlyAutomatic: (o.newlyAutomatic || []).slice(),
      metacog: (o.metacog || []).slice()
    });
    Engine.updateStreak(p, o.date);
    const flipped = Engine.maybeAdvanceDomain(p);
    p.openSession = null;
    return flipped;   // true on the one session that crosses add_sub -> mul_div
  }
  function recoverOpen(p) {
    const o = p.openSession; if (!o) return false;
    if (o.attempted > 0 && o.id && o.date) closeOut(p, o); else p.openSession = null;
    return true;
  }
  // Best-effort: ask the browser to treat saved progress as persistent, so it
  // is not evicted under storage pressure. Once per page load, after a session
  // (a user gesture). Silent where unsupported; never a blocker.
  let _persistAsked = false;
  function askPersist() {
    if (_persistAsked) return; _persistAsked = true;
    try {
      if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) {
        const r = navigator.storage.persist(); if (r && r.catch) r.catch(() => {});
      }
    } catch (e) { /* non-fatal */ }
  }
  function endSession(stoppedEarly) {
    const p = state.profile, s = state.session;
    // The add_sub -> mul_div flip is the longest climb in the whole app
    // (~80 sessions) and used to pass silently — capture it so the post
    // screen can mark it exactly once (dashboard §2.8: lead with the win).
    s.domainAdvanced = closeOut(p, tally());
    s.fanfare = s.domainAdvanced || Engine.completedTables(p, s.newlyAutomatic).length > 0;   // played by gotoPost()
    askPersist();
    // Milestone backup prompt (dashboard §9): couple the ask to a win — a new
    // gold star, or the collection crossing a 25 boundary — at most once a
    // fortnight, and only while there's no recent backup. The prompt itself is
    // a quiet card on the post screen, never a blocker.
    const cNow = Engine.collectionCounts(p);
    const milestone = s.newlyAutomatic.length > 0 || Math.floor(cNow.total / 25) > Math.floor(s.collectionBefore.total / 25);
    const lastTouch = Math.max(p.lastBackupAt || 0, p.lastBackupPromptAt || 0);
    s.backupPrompt = milestone && (Clock.now() - lastTouch > 14 * 86400000);
    if (s.backupPrompt) p.lastBackupPromptAt = Clock.now();
    state.aq = null;   // question state is done with; don't leak it into later screens
    save();
    const bonus = stoppedEarly ? null : buildBonus();
    if (bonus) { state.bonus = bonus; loadTri(); return; }
    gotoPost();
  }

  /* ---- post-session delta ---------------------------------------------- */
  function renderPost() {
    const p = state.profile, s = state.session, c = Engine.collectionCounts(p);
    const delta = c.total - s.collectionBefore.total;
    const name = p.name && p.name.trim();
    const na = s.newlyAutomatic;
    // one-time summit card: fires only on the session where the domain flips
    const summit = s.domainAdvanced
      ? `<div class="card milestone"><div class="ctitle small">A big step</div><p class="lede">Your addition and subtraction are strong \u2014 from here, sessions mostly move to times tables.</p></div>`
      : '';
    let lead;
    if (na.length) {
      const rows = Engine.completedTables(p, na);
      const rowLines = rows.map(r => `<div class="rowdone">${starSvg(1, false, 18)} ${r.op === 'mul' ? 'The whole \u00D7' + r.n + ' table' : 'All of adding ' + r.n}</div>`).join('');
      const items = na.map((id, i) => `<div class="goldwin" style="--d:${i * 90}ms">${starSvg(1, false, 22)} ${esc(Content.factQuestion(id).prompt)}</div>`).join('');
      lead = `<div class="card"><div class="ctitle small">Now off by heart</div>${rowLines}${items}</div>`;
    } else {
      const climbing = Content.allFactIds().filter(id => { const f = p.facts[id]; return f.state === 'fluent' && !f.everAutomatic; }).length;
      lead = `<p class="lede">Solid work. ${climbing ? 'A few facts are on their way \u2014 a couple more goes and they turn gold ' : 'Keep going and your first gold stars are close '}${starSvg(0.5, false, 18)}</p>`;
      // §2.8 upgraded from generic to specific: NAME the facts closest to gold
      // (Hattie task/process feedback + feed-forward). Chips only — no
      // "practise now" button, so the calm single exit stays intact.
      const near = Engine.nearlyAutomatic(p, 3);
      if (near.length) lead += `<div class="card"><div class="ctitle small">Nearly there</div><div class="nearrow">${near.map(id => `<span class="nearchip">${esc(Content.factQuestion(id).prompt)} ${starSvg(0.5, false, 16)}</span>`).join('')}</div></div>`;
    }
    const grew = `<div class="row big-row">\uD83C\uDFC6 Facts you know: <b>${c.total}</b>${delta > 0 ? ` <span class="up">\u25B2 +${delta} today</span>` : ''}</div>`;
    const acc = `<div class="row muted">You got ${s.correct} of ${s.attempted} today</div>`;
    const streak = `<div class="row">\uD83D\uDD25 ${p.streak.current}-day streak${p.streak.current > s.streakBefore ? '!' : ''}</div>`;
    const trend = Engine.trendNote(p) === 'quicker' ? `<div class="row muted">\uD83D\uDCC8 A bit quicker than last time</div>` : '';
    const backup = s.backupPrompt ? `<div class="card pad"><div class="ctitle small">Keep it safe</div><p class="muted">Good moment to save a backup \u2014 progress lives only on this device.</p><button class="btn wide" data-action="exportData">Save a backup</button></div>` : '';
    return `<div class="screen">
      <h1 class="h1">Nice work${name ? ', ' + esc(name) : ''} \uD83C\uDF89</h1>
      ${summit}${lead}${grew}${acc}${streak}${trend}${backup}
      <button class="cta" data-action="gotoHome">Back to home</button>
    </div>`;
  }

  /* ---- skill screen: a chosen table / addition row --------------------- */
  function renderSkill() {
    const p = state.profile, op = state.skillOp || 'mul', n = state.skillTable;
    const sym = op === 'mul' ? '\u00D7' : '+';
    const idOf = op === 'mul' ? Content.mulId : Content.addId;
    const ids = Array.from({ length: 11 }, (_, k) => idOf(n, k));
    const anyUnlocked = ids.some(id => Engine.choiceUnlocked(p, id));
    let rows = '';
    for (let k = 0; k <= 10; k++) {
      const id = idOf(n, k), f = p.facts[id], locked = !Engine.choiceUnlocked(p, id);
      rows += `<div class="srow${locked ? ' locked' : ''}"><span class="sq">${n} ${sym} ${k} = ${op === 'mul' ? n * k : n + k}</span>${locked ? lockSvg(20) : glyphFor(f, 20)}</div>`;
    }
    const title = op === 'mul' ? `The ${n}\u00D7 table` : `Adding ${n}`;
    let foot;
    if (anyUnlocked) {
      const verb = op === 'mul' ? `the ${n}\u00D7 table` : `adding ${n}`;
      foot = `<button class="cta" data-action="practiseTable" data-op="${op}" data-n="${n}">\u25B6 Practise ${verb}</button>`;
    } else {
      const h = Engine.tableHelper(n);
      const hLabel = h === 'doubles' ? 'your addition doubles' : 'your ' + h + '\u00D7 table';
      foot = `<div class="hint">This one opens up once you know ${hLabel} \u2014 that's the fact this table is built on.</div>`
        + (h && h !== 'doubles' ? `<button class="btn wide" data-action="chooseTable" data-op="mul" data-n="${h}">Go to your ${h}\u00D7 table</button>` : '');
    }
    return `<div class="screen">
      <button class="link back" data-action="gotoHome">\u2190 Home</button>
      <h1 class="h1">${title}</h1>
      <div class="card"><div class="srows">${rows}</div></div>
      ${foot}
    </div>`;
  }

  /* ---- browse all families --------------------------------------------- */
  function renderBrowse() {
    const p = state.profile, seen = new Map();
    for (const id of Content.allFactIds()) {
      const f = p.facts[id]; if (f.state === 'new' && !f.everFluent) continue;
      const pair = Content.familyPairOf(id), key = pair[0] + '_' + pair[1];
      const prev = seen.get(key);
      seen.set(key, { pair, t: Math.max(prev ? prev.t : -1, f.lastSeen) });
    }
    const fams = [...seen.values()].sort((a, b) => b.t - a.t);
    const legend = `<div class="legend">${lockSvg(18)}not started ${starSvg(0, false, 18)}working on it ${starSvg(0.5, false, 18)}can do ${starSvg(1, false, 18)}off by heart</div>`;
    const grids = `
      <div class="card"><div class="ctitle small">Times tables <span class="muted">\u00B7 tap a row to practise</span></div>${renderGrid(p, 'mul')}${gridLegend()}</div>
      <div class="card"><div class="ctitle small">Addition facts <span class="muted">\u00B7 tap a row to practise</span></div>${renderGrid(p, 'add')}${gridLegend()}</div>
      <div class="card"><div class="ctitle small">All your facts</div>${renderOpSummary(p)}</div>`;
    const body = fams.length
      ? fams.map(f => `<div class="card fam"><div class="ctitle small">${f.pair[0]} &amp; ${f.pair[1]}</div>${renderChain(f.pair)}</div>`).join('')
      : `<p class="lede">Nothing here yet \u2014 do a session and your families will show up.</p>`;
    return `<div class="screen">
      <button class="link back" data-action="gotoHome">\u2190 Home</button>
      <h1 class="h1">My facts</h1>${grids}
      <div class="ctitle small mt">My fact families</div>${legend}${body}
    </div>`;
  }

  /* ---- grown-ups: parent summary (Tier 1) + backup / restore ------------ */
  // One layout, two deliveries (dashboard §5.1): parentBlocksHtml() is the
  // single source of the summary markup; the in-app screen (Tier 1) and the
  // exported standalone file (Tier 0) both render it. Qualitative only — no
  // raw times, no speed targets, no comparison (§5.3).
  function fmtDate(ms) {
    try { return new Date(ms).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); }
    catch (e) { return Engine.isoDay(ms); }
  }
  function parentBlocksHtml(p, m) {
    const anySecure = m.secure.add[0] + m.secure.sub[0] + m.secure.mul[0] + m.secure.div[0] > 0;
    const focus = m.focus || (anySecure ? 'Reviewing known facts' : 'Just getting started');
    const jt = (st) => st === 'done' ? '\u2713' : st === 'progress' ? '(in progress)' : '(coming)';
    const journey = `Add ${jt(m.journey.add)} \u00B7 Sub ${jt(m.journey.sub)} \u00B7 Mult ${jt(m.journey.mul)} \u00B7 Div ${jt(m.journey.div)}`;
    const where = `<div class="card"><div class="ctitle small">Where things are</div>
      <div class="row">Working on: <b>${esc(focus)}</b></div>
      <div class="row">Journey: ${journey}</div>
      <div class="row muted">Facts secure</div>${renderOpSummary(p)}</div>`;
    const accMap = { high: 'high (most answers correct)', good: 'good (usually correct)', building: 'building (lots of new facts in the mix)' };
    const activity = `<div class="card"><div class="ctitle small">Recent activity</div>
      <div class="row">Sessions this week: <b>${m.week}</b></div>
      ${m.week === 0 ? `<div class="row muted">Hasn't practised this week</div>`
        : m.regular ? `<div class="row">Practising regularly \u2713</div>`
        : `<div class="row muted">Practised ${m.week === 1 ? 'once' : 'twice'} this week</div>`}
      ${m.accuracy ? `<div class="row">Accuracy: ${accMap[m.accuracy]}</div>` : ''}
      ${m.quicker ? `<div class="row">Getting quicker over time \u2713</div>` : ''}</div>`;
    const means = `<div class="card"><div class="ctitle small">What this means</div>
      <div class="row p">\u2022 Division comes <b>after</b> \u2014 and lags \u2014 multiplication. That's by design, not falling behind.</div>
      <div class="row p">\u2022 Facts marked "for a refresh" are normal upkeep, not lost ground.</div>
      <div class="row p">\u2022 The best support is encouraging <b>showing up and effort</b> \u2014 not speed. Praise the process, not the person.</div>
      <div class="row p">\u2022 About 10 minutes most days beats long occasional sessions.</div></div>`;
    return where + activity + means;
  }
  function summaryFileHtml(p, m) {
    const name = p.name && p.name.trim();
    return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eager4Maths \u2014 progress summary</title><style>
  body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#2A2F3A;background:#fff;margin:0 auto;padding:28px 20px;max-width:560px}
  h1{font:700 24px/1.2 Georgia,serif;color:#1D2B5E;margin:0 0 2px}
  .sub{color:#586273;margin:0 0 20px}
  .card{border:1px solid #DDE5F5;border-radius:14px;padding:16px;margin:0 0 14px}
  .ctitle{font:600 13px/1.2 Georgia,serif;color:#1D2B5E;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
  .row{margin:0 0 8px;font-size:15px}
  .muted{color:#586273}
  b{color:#2A2F3A}
  .opsum{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .opr{display:flex;align-items:center;gap:10px;font-size:13px}
  .opl{width:96px;flex:none}
  .opbar{flex:1;height:8px;border-radius:99px;background:#E7ECF5;overflow:hidden}
  .opbar span{display:block;height:100%;background:linear-gradient(90deg,#3FB873,#1B9E57);border-radius:99px}
  .opn{width:52px;text-align:right;color:#586273;flex:none}
  .foot{margin-top:18px;color:#586273;font-size:13px}
  @media print{.card{break-inside:avoid}}
</style></head><body>
<h1>Progress summary</h1>
<p class="sub">${name ? esc(name) + ' \u00B7 ' : ''}as of ${esc(fmtDate(Clock.now()))}</p>
${parentBlocksHtml(p, m)}
<p class="foot">Made with Eager4Maths. Progress stays on the family device \u2014 this summary is a snapshot to keep, print, or email to the teacher.</p>
</body></html>`;
  }
  function isInstalled() {
    try { return !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || (typeof navigator !== 'undefined' && navigator.standalone)); }
    catch (e) { return false; }
  }
  function renderGrownups() {
    const p = state.profile, m = Engine.parentSummary(p);
    const name = p.name && p.name.trim();
    return `<div class="screen">
      <button class="link back" data-action="gotoHome">\u2190 Home</button>
      <h1 class="h1">For grown-ups</h1>
      <p class="lede">Progress is saved on this device only \u2014 nothing leaves it. Because of that, clearing the browser or switching device loses it, so keep a backup now and then.</p>
      <p class="mapnote">Progress summary${name ? ' \u2014 ' + esc(name) : ''} \u00B7 as of ${esc(fmtDate(Clock.now()))}</p>
      ${parentBlocksHtml(p, m)}
      <button class="btn wide" data-action="exportSummary">Export / print summary</button>
      <p class="mapnote tapnote gap">Saves this summary as a page you can print or email to the teacher.</p>
      ${isInstalled() ? '' : `<div class="card pad">
        <div class="ctitle small">Keep it on the home screen</div>
        <p class="muted">Added to the home screen, Eager4Maths opens like an app and the phone is far less likely to clear its saved progress.</p>
        <div class="row p">iPhone or iPad: open it in Safari, tap Share, then <b>Add to Home Screen</b>.</div>
        <div class="row p">Android: open it in Chrome, tap the menu, then <b>Add to Home screen</b>.</div>
      </div>`}
      <div class="card pad">
        <div class="ctitle small">Back up progress</div>
        <p class="muted">Saves a small file you can keep or email to the teacher.</p>
        <button class="cta" data-action="exportData">Save a backup</button>
      </div>
      <div class="card pad">
        <div class="ctitle small">Restore from a backup</div>
        <p class="muted">Load a backup file to bring progress back, or move it to another device.</p>
        <label class="btn wide filein">Choose backup file<input id="importFile" type="file" accept="application/json,.json" data-action="importFile" hidden></label>
      </div>
    </div>`;
  }

  /* ---- digit entry shared by keypad + physical keyboard ---------------- */
  function pushDigit(d) { const aq = state.aq; if (!aq || aq.locked || aq.input.length >= 4) return; if (aq.firstAt == null) aq.firstAt = Date.now(); aq.input += d; const el = $('answer'); if (el) el.innerHTML = esc(aq.input); }
  function popDigit() { const aq = state.aq; if (!aq || aq.locked) return; aq.input = aq.input.slice(0, -1); const el = $('answer'); if (el) el.innerHTML = esc(aq.input) || '<span class="cursor">_</span>'; }
  function onKeyDown(e) {
    if (state.screen === 'firstRun' && e.key === 'Enter') { e.preventDefault(); ACTIONS.saveName(); return; }
    // Enter also walks the tap-through screens, so a keyboard user never has to reach for the mouse
    if (e.key === 'Enter' && state.screen === 'session' && state.session) {
      if (state.session.phase === 'card') { e.preventDefault(); ACTIONS.gotCard(); return; }
      if (state.aq && state.aq.fix && state.aq.fix.stage === 'show') { e.preventDefault(); ACTIONS.fixGot(); return; }
    }
    if (e.key === 'Enter' && state.screen === 'bonus' && state.aq && state.aq.locked) { e.preventDefault(); ACTIONS.triNext(); return; }
    const aq = state.aq; if (!aq) return;
    const inQ = state.screen === 'placement' || state.screen === 'bonus' || (state.screen === 'session' && state.session && state.session.phase !== 'card');
    if (!inQ || aq.locked) return;
    if (e.key >= '0' && e.key <= '9') { e.preventDefault(); pushDigit(e.key); }
    else if (e.key === 'Enter') { e.preventDefault(); commitAnswer(); }
    else if (e.key === 'Backspace') { e.preventDefault(); popDigit(); }
  }

  /* ---- delegated actions ----------------------------------------------- */
  const ACTIONS = {
    saveName: () => { const v = $('nameInput') ? $('nameInput').value.trim().slice(0, 20) : ''; state.profile = Engine.newProfile(); state.profile.name = v; save(); state.screen = 'name2'; render(); },
    placementBegin: () => beginPlacement(),
    placementSkipAll: () => { state.profile.placementResolved = true; save(); state.screen = 'home'; render(); },
    placementSkipOne: () => { const aq = state.aq; if (!aq || aq.locked) return; aq.locked = true; if (!aq.discard) state.placement.results.push({ factId: aq.id, correct: false, ms: 0 }); advancePlacement(); },
    startSession: () => beginSession(),
    // Early exit that keeps everything honest: fact progress is already
    // persisted per answer; if anything was attempted, close the session out
    // properly (record + streak + post screen). Nothing attempted -> just home.
    sessionStop: () => {
      const s = state.session; if (!s) return;
      if (s.attempted > 0) { endSession(true); }
      else { state.session = null; state.aq = null; state.screen = 'home'; render(); }
    },
    // "Show me how": no guess needed. Recorded as an untimed miss (see beginFix).
    showMe: () => {
      const aq = state.aq; if (!aq || aq.locked || aq.fix || aq.kind !== 'practice') return;
      aq.locked = true;
      recordAttempt(false, null, null, 'show');
      beginFix('show');
    },
    fixGot: () => {
      const aq = state.aq; if (!aq || !aq.fix || aq.fix.stage !== 'show') return;
      aq.fix.stage = 'retry'; aq.input = ''; aq.locked = false; aq.feedback = null; render();
    },
    triNext: () => {
      const b = state.bonus; if (!b || !state.aq || !state.aq.locked) return;
      b.idx++;
      if (b.idx >= b.items.length) finishBonus(); else loadTri();
    },
    triSkip: () => { if (state.bonus) finishBonus(); },
    // Partial placement is a valid seed by construction (placement spec §12.3):
    // probed facts seed, the rest stay `new`. Nothing probed yet -> same as skip.
    placementStop: () => {
      const pl = state.placement; if (!pl) return;
      if (pl.results.length) Engine.seedFromProbeResults(state.profile, pl.results);
      else state.profile.placementResolved = true;
      state.placement = null; state.aq = null;
      save(); state.screen = 'home'; render();
    },
    gotCard: () => startPhase('practice'),
    digit: (t) => pushDigit(t.getAttribute('data-d')),
    back: () => popDigit(),
    enter: () => commitAnswer(),
    metacog: (t) => { const s = state.session, aq = state.aq; s.metacog.push({ id: aq.id, m: t.getAttribute('data-m') }); aq.feedback = { correct: true, answer: aq.answer }; render(); setTimeout(advancePractice, 460); },
    gotoHome: () => { state.session = null; state.placement = null; state.aq = null; state.bonus = null; state.screen = 'home'; render(); },
    // deliberately transient (never persisted): pull-not-push means the richer
    // view defaults closed on every visit — a student has to go looking (§2.7)
    toggleProgress: () => { state.showProgress = !state.showProgress; render(); },
    gotoBrowse: () => { state.screen = 'browse'; render(); },
    gotoSky: () => { state.screen = 'sky'; render(); },   // pure view change: the sky writes nothing (sky spec §4)
    toggleSound: () => { const p = state.profile; p.settings.soundOn = p.settings.soundOn === false; save(); render(); },
    gotoGrownups: () => { state.screen = 'grownups'; render(); },
    chooseTable: (t) => { state.skillOp = t.getAttribute('data-op') || 'mul'; state.skillTable = +t.getAttribute('data-n'); state.screen = 'skill'; render(); },
    gotoSuggested: (t) => { state.skillOp = 'mul'; state.skillTable = +t.getAttribute('data-n'); state.screen = 'skill'; render(); },
    gridTab: (t) => {
      const i = +t.getAttribute('data-i');
      const car = $('gcar');
      if (car && car.children && car.children[i]) {
        // offsetLeft is relative to the nearest POSITIONED ancestor — with
        // none, that's the page. On a centred desktop layout every slide's
        // offsetLeft therefore exceeded the carousel's max scroll, so
        // scrollTo clamped to the LAST slide and "Times tables" became
        // unreachable. Normalise against the first slide so the target is
        // carousel-relative in any layout. (Mobile masked this: the page
        // x-offset is small enough there that scroll-snap absorbed it.)
        const base = car.children[0].offsetLeft || 0;
        const x = (car.children[i].offsetLeft || 0) - base;
        if (car.scrollTo) car.scrollTo({ left: x, behavior: reducedMotion() ? 'auto' : 'smooth' }); else car.scrollLeft = x;
      }
      setActiveTab(i);
    },
    practiseTable: (t) => { const op = t.getAttribute('data-op') || 'mul', n = +t.getAttribute('data-n'); beginSession(op === 'mul' ? Engine.mulTableIds(n) : Array.from({ length: 11 }, (_, k) => Content.addId(n, k))); },
    exportData: () => {
      try {
        const blob = new Blob([Store.exportJSON(state.profile)], { type: 'application/json' });
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = 'eager4maths-backup-' + Engine.isoDay(Date.now()) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        state.profile.lastBackupAt = Clock.now(); save();   // a fresh backup quiets the milestone prompt
      } catch (e) { alert('Could not create a backup file.'); }
    },
    // Tier 0 (dashboard §5.5): the HUMAN-read summary file. Deliberately does
    // NOT touch lastBackupAt — only the machine-read JSON is the safety net.
    exportSummary: () => {
      try {
        const html = summaryFileHtml(state.profile, Engine.parentSummary(state.profile));
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = 'eager4maths-summary-' + Engine.isoDay(Date.now()) + '.html';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      } catch (e) { alert('Could not create the summary file.'); }
    }
  };
  function onAppClick(e) {
    const t = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!t) return;
    if (t.isConnected === false) return;   // a re-render already replaced this node: drop the stale click
    const fn = ACTIONS[t.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(t, e); }
  }
  function onAppChange(e) {
    const t = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!t || t.getAttribute('data-action') !== 'importFile') return;
    const file = t.files && t.files[0];
    t.value = '';   // clear selection so the same file can be re-imported later
    if (!file) return;
    if (state.profile && typeof window.confirm === 'function' &&
        !window.confirm('This replaces the progress saved on this device with the backup. Continue?')) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = Store.importJSON(reader.result);   // validates + normalises
        recoverOpen(obj);
        state.profile = obj; save();
        state.session = null; state.placement = null; state.aq = null; state.bonus = null;
        state.screen = 'home'; render();
      } catch (err) { alert('That file could not be read as a backup.'); }
    };
    reader.readAsText(file);
  }

  function mount() {
    const app = $('app'); if (!app) return;
    app.addEventListener('click', onAppClick);
    app.addEventListener('change', onAppChange);
    if (document.addEventListener) {
      document.addEventListener('keydown', onKeyDown);
      // a question left on screen while the page was hidden is answered untimed (see timing())
      document.addEventListener('visibilitychange', () => { const aq = state.aq; if (document.hidden && aq && !aq.locked) aq.away = true; });
    }
    const loaded = Store.load();
    if (loaded && recoverOpen(loaded)) Store.save(loaded);   // credit a session left mid-way last time
    if (loaded) { state.profile = loaded; state.screen = loaded.placementResolved ? 'home' : 'name2'; }
    else { state.profile = null; state.screen = 'firstRun'; }
    render();
  }

  return { mount };
})();
/* ===========================================================================
 * BOOT (dual-mode).
 *   node                -> full test/sim report + exit code (verification)
 *   browser ?debug=1    -> render the engine report into #app
 *   browser (default)   -> cheap content-integrity guard, then UI.mount()
 * ==========================================================================*/
function __computeReport() {
  return { validate: Debug.validateContent(), tests: Debug.runTests(), sims: Debug.runSimChecks() };
}
function __renderReport(r) {
  const el = document.getElementById('app'); if (!el) return;
  const ok = (b) => b ? '<span class="ok">PASS</span>' : '<span class="bad">FAIL</span>';
  const list = (arr) => arr.length ? '<ul>' + arr.map(x => `<li class="bad">${x}</li>`).join('') + '</ul>' : '<div class="ok">none</div>';
  const s = r.sims.samples, s1 = s.s1, s2 = s.s2, s3 = s.s3;
  el.innerHTML = `
    <div class="report">
    <h1>Eager4Maths — engine report</h1>
    <p class="sub">Diagnostic view (?debug=1). The app itself is at the same URL without the flag.</p>
    <section><h2>Content integrity ${ok(r.validate.pass)}</h2>${list(r.validate.failures)}</section>
    <section><h2>Unit + behaviour ${ok(r.tests.pass)}</h2><div class="muted">${r.tests.failures.length ? r.tests.failures.length + ' failing' : 'all checks green'}</div>${list(r.tests.failures)}</section>
    <section><h2>Simulator integration ${ok(r.sims.pass)}</h2>${list(r.sims.failures)}
      <table>
        <tr><th></th><th>perfect/skip (80)</th><th>perfect/reduced (420)</th><th>anchors/skip (60)</th></tr>
        <tr><td>final domain</td><td>${s1.finalDomain}</td><td>${s2.finalDomain}</td><td>${s3.finalDomain}</td></tr>
        <tr><td>transition @</td><td>${s1.transitionAtSession}</td><td>${s2.transitionAtSession}</td><td>${s3.transitionAtSession}</td></tr>
        <tr><td>n/acq/flu/auto</td><td>${s1.states.new}/${s1.states.acquiring}/${s1.states.fluent}/${s1.states.automatic}</td><td>${s2.states.new}/${s2.states.acquiring}/${s2.states.fluent}/${s2.states.automatic}</td><td>${s3.states.new}/${s3.states.acquiring}/${s3.states.fluent}/${s3.states.automatic}</td></tr>
        <tr><td>auto mul/div</td><td>${s1.autoMul}/${s1.autoDiv}</td><td>${s2.autoMul}/${s2.autoDiv}</td><td>${s3.autoMul}/${s3.autoDiv}</td></tr>
      </table>
    </section>
    <p class="foot">${(r.validate.pass && r.tests.pass && r.sims.pass) ? 'Engine green against spec.' : 'NOT green — see failures.'}</p>
    </div>`;
}

if (typeof window === 'undefined') {
  const r = __computeReport(), line = '\u2500'.repeat(64), mark = (b) => b ? 'PASS' : 'FAIL';
  console.log(line);
  console.log('Eager4Maths — engine verification (node)');
  console.log(line);
  console.log('Content integrity : ' + mark(r.validate.pass)); r.validate.failures.forEach(f => console.log('   - ' + f));
  console.log('Unit + behaviour  : ' + mark(r.tests.pass) + '  (' + r.tests.failures.length + ' failing)'); r.tests.failures.forEach(f => console.log('   - ' + f));
  console.log('Simulator checks  : ' + mark(r.sims.pass)); r.sims.failures.forEach(f => console.log('   - ' + f));
  console.log(line);
  for (const [k, v] of Object.entries(r.sims.samples)) console.log(`${k}: domain=${v.finalDomain} transition@=${v.transitionAtSession} states[n/a/f/au]=${v.states.new}/${v.states.acquiring}/${v.states.fluent}/${v.states.automatic} autoMul/Div=${v.autoMul}/${v.autoDiv}`);
  console.log(line);
  const green = r.validate.pass && r.tests.pass && r.sims.pass;
  console.log(green ? 'EXIT CRITERION MET \u2713' : 'NOT GREEN \u2717');
  if (typeof process !== 'undefined') process.exitCode = green ? 0 : 1;
} else {
  const vc = Debug.validateContent();             // cheap always-on guard
  if (!vc.pass) {
    const el = document.getElementById('app');
    if (el) el.innerHTML = '<div style="padding:20px;font-family:monospace;color:#C0392B"><b>Content check failed — not launching.</b><ul>' + vc.failures.map(f => '<li>' + f + '</li>').join('') + '</ul></div>';
  } else if (/[?&]debug=1\b/.test(location.search)) {
    __renderReport(__computeReport());
  } else {
    UI.mount();
    // PWA: offline shell + add-to-home-screen. Registration is best-effort —
    // the app is fully functional without it (e.g. older browsers, file://).
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      try { navigator.serviceWorker.register('./sw.js').catch(() => { /* non-fatal: no sw.js beside the page */ }); } catch (e) { /* non-fatal */ }
    }
  }
}
