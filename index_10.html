    let inner;
    if (fill >= 1) inner = `<path d="${STAR}" fill="var(--gold-fill)" stroke="var(--gold-edge)" stroke-width="1.1" stroke-linejoin="round"/>`;
    else if (fill > 0) inner = `<clipPath id="${id}"><rect x="0" y="0" width="12" height="24"/></clipPath><path d="${STAR}" fill="var(--gold-fill)" clip-path="url(#${id})"/><path d="${STAR}" fill="none" stroke="var(--gold-edge)" stroke-width="1.1" stroke-linejoin="round"/>`;
    else inner = `<path d="${STAR}" fill="none" stroke="var(--star-outline)" stroke-width="1.6" stroke-linejoin="round"/>`;
    const badge = refresh ? `<circle cx="19.6" cy="4.8" r="4.7" fill="var(--refresh)"/><text x="19.6" y="7.4" text-anchor="middle" font-size="7.4" fill="#fff">\u21BB</text>` : '';
    return `<svg class="glyph" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${inner}${badge}</svg>`;
  }
  function lockSvg(size) { size = size || 24; return `<svg class="glyph" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="var(--lock)"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="var(--lock)" stroke-width="2"/></svg>`; }
  function glyphFor(f, size) {
    // Never-shrink fidelity (dashboard §3/§6.3): a slipped automatic fact
    // KEEPS its full gold star and wears the ↻ badge; only hard, repeated
    // failure (falling all the way to acquiring) demotes the visible label,
    // and even then it reads as refreshing, not lost.
    if (f.state === 'automatic') return starSvg(1, false, size);
    if (f.everAutomatic) return starSvg(f.state === 'fluent' ? 1 : 0.5, true, size);
    if (f.state === 'fluent') return starSvg(0.5, false, size);
    if (f.everFluent) return starSvg(0.5, true, size);     // slipped can-do: keeps its half star
    if (f.state === 'acquiring') return starSvg(0, false, size); // genuinely learning
    return lockSvg(size);
  }

  function describeFocus(p) {
    const acq = Content.allFactIds().filter(id => p.facts[id].state === 'acquiring');
    if (!acq.length) return null;
    let id = acq[0], t = -1; for (const x of acq) if (p.facts[x].lastSeen > t) { t = p.facts[x].lastSeen; id = x; }
    const { op, a, b } = Content.parse(id);
    if (op === 'mul') return '\u00D7' + Content.leadFactor(a, b) + ' facts';
    if (op === 'div') return 'division facts';
    if (op === 'sub') return 'take-away facts';
    if (op === 'add') { const r = Content.addPhaseRank(a, b); return r === 1 ? 'doubles' : r === 2 ? 'pairs that make ten' : r === 3 ? 'make-ten facts' : r === 4 ? 'near-doubles' : 'adding facts'; }
    return null;
  }

  /* ---- root render dispatch -------------------------------------------- */
  function render() {
    const app = $('app'); if (!app) return;
    const screens = { firstRun: renderFirstRun, name2: renderPlacementChoice, placement: renderPlay, home: renderHome, session: renderSession, post: renderPost, browse: renderBrowse, grownups: renderGrownups, skill: renderSkill };
    app.innerHTML = (screens[state.screen] || renderHome)();
    if (window.scrollTo) window.scrollTo(0, 0);
    wireCarousel();   // re-attach the swipe->tab sync whenever the carousel is on screen
  }
  function setActiveTab(i) {
    const tabs = document.querySelectorAll ? document.querySelectorAll('.gtabs .gtab') : null;
    if (!tabs) return;
    for (let k = 0; k < tabs.length; k++) {
      if (tabs[k].classList) tabs[k].classList.toggle('active', k === i);
      if (tabs[k].setAttribute) tabs[k].setAttribute('aria-pressed', k === i ? 'true' : 'false');
    }
  }
  function wireCarousel() {
    const car = $('gcar'); if (!car || car._wired) return; car._wired = true;
    let ticking = false;
    car.addEventListener('scroll', () => {
      if (ticking) return; ticking = true;
      const settle = () => {
        ticking = false;
        const kids = car.children; if (!kids || !kids.length) return;
        const base = kids[0].offsetLeft || 0;   // page-relative -> carousel-relative (see gridTab)
        let best = 0, bd = Infinity;
        for (let k = 0; k < kids.length; k++) { const d = Math.abs(((kids[k].offsetLeft || 0) - base) - car.scrollLeft); if (d < bd) { bd = d; best = k; } }
        setActiveTab(best);   // swiping the grids updates which tab reads active
      };
      if (window.requestAnimationFrame) window.requestAnimationFrame(settle); else setTimeout(settle, 80);
    });
  }

  /* ---- first run: name (skippable) + placement choice ------------------ */
  function renderFirstRun() {
    return `<div class="screen">
      <div class="brand">Eager4Maths</div>
      <h1 class="h1">Welcome \uD83D\uDC4B</h1>
      <p class="lede">A few minutes of maths facts, most days. Your stars fill in as you go.</p>
      <div class="card pad">
        <label class="lbl" for="nameInput">What should we call you? <span class="muted">(optional)</span></label>
        <input id="nameInput" class="textin" type="text" maxlength="20" autocomplete="off" placeholder="First name">
      </div>
      <button class="cta" data-action="saveName">Let's go</button>
    </div>`;
  }
  function renderPlacementChoice() {
    const name = state.profile.name && state.profile.name.trim();
    return `<div class="screen">
      <h1 class="h1">${name ? 'Hi ' + esc(name) + ' \uD83D\uDC4B' : 'Nice to meet you \uD83D\uDC4B'}</h1>
      <p class="lede">Want a quick check first, so we start at the right spot? About two minutes \u2014 and it's fine to guess or skip any.</p>
      <button class="cta" data-action="placementBegin">Yes, quick check</button>
      <button class="btn wide" data-action="placementSkipAll">Skip \u2014 just start</button>
    </div>`;
  }

  /* ---- reduced placement (Option B) ------------------------------------ */
  // The first `placementWarmupItems` are an on-ramp (placement spec §2):
  // presented like any other item but DISCARDED from seeding, so the timing
  // of the real probes isn't polluted by find-the-keypad latency — which
  // otherwise lands on the first doubles and can silently cost the basal
  // credit. Warm-up items are easy count-on facts outside the probe set.
  const PLACEMENT_WARMUP_POOL = ['add_1_3', 'add_2_4', 'add_1_4'];
  function beginPlacement() {
    const n = state.profile.settings.placementWarmupItems || 0;
    const warm = PLACEMENT_WARMUP_POOL.slice(0, n).map(id => Object.assign({ id, discard: true }, Content.factQuestion(id, Rng)));
    const items = warm.concat(Engine.placementPhaseAIds().map(id => Object.assign({ id }, Content.factQuestion(id, Rng))));
    state.placement = { items, idx: 0, results: [], phaseB: false };
    loadPlacementQ();
  }
  function loadPlacementQ() {
    const pl = state.placement, it = pl.items[pl.idx];
    state.aq = { kind: 'placement', id: it.id, prompt: it.prompt, answer: it.answer, discard: !!it.discard, input: '', shownAt: Date.now(), locked: false, feedback: null };
    state.screen = 'placement'; render();
  }

  /* ---- home dashboard --------------------------------------------------- */
  function renderHome() {
    const p = state.profile, c = Engine.collectionCounts(p), first = realSessions(p).length === 0;
    const name = p.name && p.name.trim();
    const greeting = name ? 'Hi ' + esc(name) + ' \uD83D\uDC4B' : 'Hi \uD83D\uDC4B';
    const prog = Math.round(Engine.domainProgress(p) * 100);
    const focus = describeFocus(p);
    const trend = Engine.trendNote(p);
    const pair = Engine.featuredFamilyPair(p);

    const tiers = `
      <div class="tier">${starSvg(1, false, 20)}<b>${c.gold}</b><span>know off by heart</span></div>
      <div class="tier">${starSvg(0.5, false, 20)}<b>${c.canDo}</b><span>can do</span></div>
      ${c.refresh ? `<div class="tier">${starSvg(0.5, true, 20)}<b>${c.refresh}</b><span>needs a refresh</span></div>` : ''}`;
    const collection = `<div class="card collection">
      <div class="ctitle">\uD83C\uDFC6 Facts you know</div>
      <div class="count-big">${c.total}</div>
      <div class="bar" aria-hidden="true"><span style="width:${Math.max(4, prog)}%"></span></div>
      <div class="growing">growing</div>
      <div class="tiers">${tiers}</div>
    </div>`;
    const intro = first
      ? `<p class="lede">${c.total > 0
        ? "You're not starting from scratch \u2014 you already know <b>" + c.total + "</b> facts. Half stars are facts you can do; gold stars are facts you know off by heart."
        : "As you practise, your stars fill in \u2014 half stars for facts you can do, gold stars for facts you know off by heart."}</p>`
      : '';
    const cta = `<button class="cta big" data-action="startSession">\u25B6 Start today<small>~10 min${focus ? ' \u00B7 ' + esc(focus) : ''}</small></button>`;
    // choice-grid on-ramp: surface the next open table so times tables are a
    // visible destination during the add_sub era, not something to stumble on
    const sug = Engine.suggestedTable(p);
    const suggest = sug != null ? `<button class="link suggest" data-action="gotoSuggested" data-n="${sug}">Times tables are open \u2014 try \u00D7${sug} \u2192</button>` : '';
    const gridsCard = `<div class="card">
      <div class="gtabs">
        <button class="gtab active" aria-pressed="true" data-action="gridTab" data-i="0">Times tables</button>
        <button class="gtab" aria-pressed="false" data-action="gridTab" data-i="1">Addition</button>
      </div>
      <div class="gcar" id="gcar">
        <div class="gslide">${renderGrid(p, 'mul')}<p class="mapnote tapnote">Tap a row number to practise that table.</p></div>
        <div class="gslide">${renderGrid(p, 'add')}<p class="mapnote tapnote">Tap a row number to practise adding that number.</p></div>
      </div>
      ${gridLegend()}
    </div>`;
    const summary = `<div class="card"><div class="ctitle small">All your facts</div>${renderOpSummary(p)}</div>`;
    const chain = pair ? `<div class="card chain-card"><div class="ctitle small">Today's family \u2014 ${pair[0]} &amp; ${pair[1]}</div>${renderChain(pair)}</div>` : '';
    const streak = !first ? `<div class="row streak"><span>\uD83D\uDD25 ${p.streak.current}-day streak</span><span class="muted">best ${p.streak.longest}</span></div>` : '';
    const trendLine = trend === 'quicker' ? `<div class="row trend">\uD83D\uDCC8 You're getting quicker \u2014 that's facts becoming automatic.</div>` : '';
    const links = `<div class="links">
      <button class="link" data-action="gotoBrowse">See all my facts</button>
      <button class="link" data-action="gotoGrownups">For grown-ups</button>
    </div>`;

    return `<div class="screen">
      <div class="brand">Eager4Maths</div>
      <div class="greet">${greeting}</div>
      ${collection}${intro}${cta}${suggest}${gridsCard}${summary}${chain}${streak}${trendLine}${links}
    </div>`;
  }

  function renderChain(pair) {
    const ids = Content.familyMembers(pair[0], pair[1]);
    const nodes = ids.map(id => {
      const f = state.profile.facts[id];
      return `<div class="node"><div class="nq">${esc(Content.factQuestion(id).prompt)}</div>${glyphFor(f, 26)}</div>`;
    }).join('<span class="arrow">\u2192</span>');
    return `<div class="chain">${nodes}</div>`;
  }

  function tierClass(f) {
    if (f.state === 'automatic') return 'auto';
    if (f.state === 'fluent') return f.everAutomatic ? 'refresh' : 'flu';
    if (f.everFluent) return 'refresh';
    if (f.state === 'acquiring') return 'acq';
    return 'new';
  }
  function renderGrid(p, op) {
    const idOf = op === 'mul' ? Content.mulId : Content.addId;
    const sym = op === 'mul' ? '\u00D7' : '+';
    const lab = (n) => `<div class="gc glabel tap" data-action="chooseTable" data-op="${op}" data-n="${n}">${n}</div>`;
    let cells = `<div class="gc gcorner">${sym}</div>`;
    for (let c = 0; c <= 10; c++) cells += lab(c);
    for (let r = 0; r <= 10; r++) {
      cells += lab(r);
      for (let c = 0; c <= 10; c++) { const f = p.facts[idOf(r, c)]; cells += `<div class="gc ${tierClass(f)}" title="${r}${sym}${c}"></div>`; }
    }
    return `<div class="mgrid" role="img" aria-label="${op === 'mul' ? 'Multiplication' : 'Addition'} progress grid; fact counts are in the summary below">${cells}</div>`;
  }
  function gridLegend() {
    return `<div class="gridleg">
      <span><i class="sw new"></i>not started</span>
      <span><i class="sw acq"></i>working</span>
      <span><i class="sw flu"></i>can do</span>
      <span><i class="sw auto"></i>off by heart</span>
    </div>`;
  }
  function renderOpSummary(p) {
    const o = Engine.opSummary(p);
    const row = (label, key) => { const k = o[key][0], t = o[key][1], pct = t ? Math.round(k / t * 100) : 0; return `<div class="opr"><span class="opl">${label}</span><span class="opbar"><span style="width:${pct}%"></span></span><span class="opn">${k}/${t}</span></div>`; };
    return `<div class="opsum">${row('Addition', 'add')}${row('Subtraction', 'sub')}${row('Multiplication', 'mul')}${row('Division', 'div')}</div>`;
  }

  /* ---- the session: warm-up -> strategy card -> timed practice --------- */
  function beginSession(focusIds) {
    const p = state.profile;
    const focused = Array.isArray(focusIds) && focusIds.length > 0;
    const plan = focused ? Engine.buildFocusedSession(p, focusIds) : Engine.buildSession(p);
    let known;
    if (focused) {
      const fop = Content.parse(plan.focus[0] || focusIds[0]).op;
      known = Content.allFactIds().filter(id => Engine.isFluentOrAbove(p.facts[id]) && Content.parse(id).op === fop);
    } else {
      const dom = p.settings.currentDomain;
      known = Content.allFactIds().filter(id => Engine.isFluentOrAbove(p.facts[id]) && Content.domainOf(id) === dom);
    }
    const warmup = shuffleArr(known).slice(0, 3).map(id => Object.assign({ id }, Content.factQuestion(id, Rng)));
    // Strategy card only for a fact being LEARNED (new/acquiring). Cards are
    // retired once retrieval is the job — showing one for a fluent/automatic
    // fact (possible in chosen-table sessions) would invite continued
    // deriving, the exact pattern the retire-at-automatic scoping exists to
    // stop (strategy spec §1).
    const learnable = plan.focus.filter(id => { const st = p.facts[id].state; return st === 'new' || st === 'acquiring'; });
    const primary = plan.introduced || (learnable.length ? learnable[learnable.length - 1] : null);
    const card = primary ? Content.cardContent(primary) : null;
    state.session = {
      id: 'sess_' + Date.now(), plan, phase: null, focused: focused,
      warmup, wIdx: 0, card, primary,
      practice: plan.trials.slice(), pIdx: 0,
      errors: {}, retired: new Set(), focusSet: new Set(plan.focus),
      metacogShown: 0, metacog: [],
      attempted: 0, correct: 0, msSum: 0, msN: 0, newlyAutomatic: [],
      collectionBefore: Engine.collectionCounts(p), streakBefore: p.streak.current
    };
    state.screen = 'session';
    if (warmup.length) startPhase('warmup');
    else if (card) startPhase('card');
    else startPhase('practice');
  }
  function startPhase(phase) {
    const s = state.session; s.phase = phase;
    if (phase === 'warmup') loadWarmupQ();
    else if (phase === 'card') render();
    else loadPracticeQ();
  }
  function loadWarmupQ() {
    const s = state.session, it = s.warmup[s.wIdx];
    state.aq = { kind: 'warmup', id: it.id, prompt: it.prompt, answer: it.answer, input: '', shownAt: Date.now(), locked: false, feedback: null };
    render();
  }
  function loadPracticeQ() {
    const s = state.session;
    while (s.pIdx < s.practice.length) {
      const id = s.practice[s.pIdx];
      if (s.focusSet.has(id) && s.retired.has(id)) { s.pIdx++; continue; }
      const q = Content.factQuestion(id, Rng);
      state.aq = { kind: 'practice', id, prompt: q.prompt, answer: q.answer, input: '', shownAt: Date.now(), locked: false, feedback: null };
      render(); return;
    }
    endSession();
  }
  function renderSession() {
    const s = state.session;
    if (s.phase === 'card') return renderCard();
    if (s.phase === 'warmup') return renderPlay({ label: '\uD83C\uDF31 Warm-up', prog: (s.wIdx + 1) + ' of ' + s.warmup.length, hint: 'Easy ones to start.', stop: 'session' });
    return renderPlay({ label: 'Practice', prog: Math.min(s.pIdx + 1, s.practice.length) + ' of ' + s.practice.length, stop: 'session' });
  }
  function renderCard() {
    const s = state.session, card = s.card, q = Content.factQuestion(s.primary);
    return `<div class="screen">
      <div class="beat">A way to think about it</div>
      <div class="card cardface">
        <div class="clabel">${esc(card.label)}</div>
        <div class="cprompt">${esc(q.prompt)}</div>
        <div class="ctalk">${esc(card.talk)}</div>
        <div class="cworked">${esc(card.worked)}</div>
      </div>
      <button class="cta" data-action="gotCard">Got it</button>
    </div>`;
  }

  /* ---- shared question screen (warm-up / practice / placement) --------- */
  function renderPlay(opts) {
    opts = opts || (state.screen === 'placement'
      ? { label: 'Quick check', prog: (state.placement.idx + 1) + ' of ' + state.placement.items.length, hint: "Answer what you can \u2014 guessing or skipping is fine.", skip: true, stop: 'placement' }
      : {});
    const aq = state.aq, fb = aq.feedback;
    let body;
    if (fb && fb.metacog) {
      body = `<div class="metacog">
        <div class="mq">How did you get it?</div>
        <button class="mbtn" data-action="metacog" data-m="counted">I counted</button>
        <button class="mbtn" data-action="metacog" data-m="usedfact">I used a fact I knew</button>
        <button class="mbtn" data-action="metacog" data-m="knew">I just knew it</button>
      </div>`;
    } else if (fb) {
      body = fb.correct
        ? `<div class="fb ok" role="status" aria-live="polite">\u2713 Yes!</div>`
        : `<div class="fb soft" role="status" aria-live="polite">Not quite \u2014 ${esc(aq.prompt)} = <b>${fb.answer}</b></div>`;
    } else {
      body = keypad();
    }
    const ansClass = fb ? (fb.correct ? 'ok' : fb.metacog ? '' : 'soft') : '';
    return `<div class="screen play">
      <div class="beat">${esc(opts.label || '')}${opts.prog ? ` <span class="prog">${esc(opts.prog)}</span>` : ''}</div>
      <div class="qcard">
        <div class="prompt">${esc(aq.prompt)}</div><div class="eq">=</div>
        <div class="answer ${ansClass}" id="answer">${esc(aq.input) || '<span class="cursor">_</span>'}</div>
      </div>
      ${body}
      ${opts.hint && !fb ? `<div class="hint">${esc(opts.hint)}</div>` : ''}
      ${opts.skip && !fb ? `<button class="link skip" data-action="placementSkipOne">I don't know this one</button>` : ''}
      ${opts.stop && !fb ? (opts.stop === 'placement'
        ? `<button class="link skip" data-action="placementStop">Stop here \u2014 keep what we've done</button>`
        : `<button class="link skip" data-action="sessionStop">Stop here for today</button>`) : ''}
    </div>`;
  }
  function keypad() {
    const k = (d) => `<button class="key" data-action="digit" data-d="${d}">${d}</button>`;
    return `<div class="keypad">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}
      <button class="key sub" data-action="back" aria-label="delete">\u232B</button>
      ${k(0)}
      <button class="key go" data-action="enter" aria-label="enter">\u2713</button>
    </div>`;
  }

  /* ---- answer evaluation ----------------------------------------------- */
  function commitAnswer() {
    const aq = state.aq; if (!aq || aq.locked || aq.input === '') return;
    const ms = Date.now() - aq.shownAt;
    const correct = parseInt(aq.input, 10) === aq.answer;
    aq.locked = true;
    if (aq.kind === 'placement') {
      if (!aq.discard) state.placement.results.push({ factId: aq.id, correct, ms });
      aq.feedback = { correct, answer: aq.answer }; render();
      setTimeout(advancePlacement, correct ? 520 : 1100); return;
    }
    const p = state.profile, s = state.session;
    const before = p.facts[aq.id].state;
    Engine.applyAttempt(p, aq.id, { correct, ms, sessionId: s.id, ts: Clock.now(), warmup: aq.kind === 'warmup' });
    s.attempted++; if (correct) s.correct++; s.msSum += ms; s.msN++;
    if (p.facts[aq.id].state === 'automatic' && before !== 'automatic') s.newlyAutomatic.push(aq.id);
    if (aq.kind === 'practice' && s.focusSet.has(aq.id) && !correct) { s.errors[aq.id] = (s.errors[aq.id] || 0) + 1; if (s.errors[aq.id] >= 3) s.retired.add(aq.id); }
    save();  // persist per attempt: an interrupted session never loses fact progress
    const wantMeta = aq.kind === 'practice' && correct && s.focusSet.has(aq.id) && s.metacogShown < 2 && Rng() < 0.5;
    if (wantMeta) { s.metacogShown++; aq.feedback = { metacog: true }; render(); return; }
    aq.feedback = { correct, answer: aq.answer }; render();
    setTimeout(aq.kind === 'warmup' ? advanceWarmup : advancePractice, correct ? 520 : 1100);
  }
  function advancePlacement() {
    const pl = state.placement; if (!pl) return;   // timer outlived the flow: drop it
    pl.idx++;
    if (pl.idx >= pl.items.length) {
      // Phase B (placement spec §3): only an add-strong Phase A opens the mul
      // sample; everyone else finishes here and never faces it.
      if (!pl.phaseB && Engine.phaseBFromProbes(pl.results, state.profile.settings)) {
        pl.phaseB = true;
        pl.items = pl.items.concat(Engine.placementPhaseBIds().map(id => Object.assign({ id }, Content.factQuestion(id, Rng))));
        loadPlacementQ(); return;
      }
      Engine.seedFromProbeResults(state.profile, pl.results); // seeds + sets placementResolved + maybeAdvanceDomain
      state.placement = null; state.aq = null;                // drop transient probe state
      save(); state.screen = 'home'; render(); return;
    }
    loadPlacementQ();
  }
  function advanceWarmup() {
    const s = state.session; if (!s) return;
    s.wIdx++;
    if (s.wIdx >= s.warmup.length) { startPhase(s.card ? 'card' : 'practice'); return; }
    loadWarmupQ();
  }
  function advancePractice() { const s = state.session; if (!s) return; s.pIdx++; loadPracticeQ(); }
  function endSession() {
    const p = state.profile, s = state.session;
    if (s.plan.introduced) p.lastIntroducedId = s.plan.introduced;
    p.sessions.push({
      id: s.id, date: Engine.isoDay(Clock.now()), domain: p.settings.currentDomain,
      attempted: s.attempted, correct: s.correct,
      meanMs: s.msN ? Math.round(s.msSum / s.msN) : 0,
      newlyAutomatic: s.newlyAutomatic.slice(),
      metacog: s.metacog.slice()
    });
    Engine.updateStreak(p, Engine.isoDay(Clock.now()));
    Engine.maybeAdvanceDomain(p);
    // Milestone backup prompt (dashboard §9): couple the ask to a win — a new
    // gold star, or the collection crossing a 25 boundary — at most once a
    // fortnight, and only while there's no recent backup. The prompt itself is
    // a quiet card on the post screen, never a blocker.
    const cNow = Engine.collectionCounts(p);
    const milestone = s.newlyAutomatic.length > 0 || Math.floor(cNow.total / 25) > Math.floor(s.collectionBefore.total / 25);
    const lastTouch = Math.max(p.lastBackupAt || 0, p.lastBackupPromptAt || 0);
    s.backupPrompt = milestone && (Clock.now() - lastTouch > 14 * 86400000);
    if (s.backupPrompt) p.lastBackupPromptAt = Clock.now();
    state.aq = null;   // question state is done with; don't leak it into later screens

    // the app is fully functional without it (e.g. older browsers, file://).
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      try { navigator.serviceWorker.register('./sw.js'); } catch (e) { /* non-fatal */ }
    }
  }
}
</script>
